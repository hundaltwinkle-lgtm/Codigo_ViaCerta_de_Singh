<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b52f2a">
<meta name="mobile-web-app-capable" content="yes">
<title>IMT_27_Código — Configuração IA</title>
<link rel="stylesheet" href="css/mobile-base.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body class="safe-top safe-bottom">

<header class="app-bar">
  <button class="icon-btn" id="backBtn" type="button" aria-label="Voltar" title="Voltar">&#8249;</button>
  <div class="app-title" id="pageTitle">Config IA</div>
  <span class="spacer"></span>
  <button class="lang-btn" id="langBtn" type="button">PT</button>
</header>

<main class="page">

  <div class="card">
    <form id="aiForm" autocomplete="off">
      <div class="field">
        <label for="fEndpoint"><span id="lEndpoint">Endpoint</span>
          <small id="lEndpointHint">URL da API compatível com OpenAI (chat/completions).</small>
        </label>
        <input type="url" id="fEndpoint" name="endpoint" inputmode="url" spellcheck="false">
      </div>

      <div class="field">
        <label for="fModel"><span id="lModel">Modelo</span></label>
        <input type="text" id="fModel" name="model" spellcheck="false">
      </div>

      <div class="field">
        <label for="fApiKey"><span id="lApiKey">Chave da API</span>
          <small id="lApiKeyHint">Guardada apenas neste dispositivo.</small>
        </label>
        <input type="password" id="fApiKey" name="apiKey" placeholder="PASTE_YOUR_API_KEY_HERE" spellcheck="false">
      </div>

      <div class="field switch-field">
        <label for="fIncludeImage"><span id="lIncludeImage">Enviar imagem</span>
          <small id="lIncludeImageHint">Inclui a imagem da pergunta no pedido à IA.</small>
        </label>
        <span class="switch">
          <input type="checkbox" id="fIncludeImage" name="includeImage">
          <span class="track"></span>
        </span>
      </div>

      <div class="field">
        <label for="fMaxTokens"><span id="lMaxTokens">Máx. tokens</span></label>
        <input type="number" id="fMaxTokens" name="maxTokens" min="200" max="50000" step="100" inputmode="numeric">
      </div>

      <div class="field">
        <label for="fTemperature"><span id="lTemperature">Temperatura</span>
          <small id="lTemperatureHint">0 = preciso · 1 = criativo.</small>
        </label>
        <input type="number" id="fTemperature" name="temperature" min="0" max="1" step="0.1" inputmode="decimal">
      </div>
      <div class="field">
        <label for="fCustomPrompt">Instruções adicionais para IA
          <small>Opcional. Não pode alterar a pergunta em português nem a resposta correta guardada na base de dados.</small>
        </label>
        <textarea id="fCustomPrompt" rows="4" maxlength="4000" placeholder="Ex.: explique de forma mais curta e clara."></textarea>
      </div>

      <div class="stack-actions">
        <button class="btn btn-primary" id="saveBtn" type="submit">Guardar</button>
        <button class="btn" id="testBtn" type="button">Testar ligação</button>
      </div>
      <div class="test-result" id="testResult"></div>
    </form>
  </div>

  <div class="card">
    <div class="section-title" id="lDefaultLang" style="margin:0 0 8px">Idioma por omissão</div>
    <div class="seg" id="langSeg">
      <button type="button" data-lang="pt">Português</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="pa">ਪੰਜਾਬੀ</button>
    </div>
    <div class="note" id="langNote" style="margin:10px 0 0">O idioma escolhido aplica-se a todos os ecrãs da aplicação.</div>
  </div>

  <div class="about-card">
    <div class="app-name">IMT_27_Código</div>
    <div>Versão <b>1.0.0</b></div>
    <div id="aboutDb">Base de dados: —</div>
    <div class="owner">© 2026 Lakhwinder Singh</div>
  </div>
</main>

<footer class="footer">
  <div class="owner" id="footerOwner">Lakhwinder Singh</div>
  <div id="footerCpy">Copyright © 2026 — Todos os direitos reservados.</div>
</footer>

<!-- Ordem de carregamento (bridge): jquery -> mobile-db -> mobile-ai ->
     mobile-tts -> mobile-apputil -> DBPerguntas -> ai.js -> tts.js -->
<script src="lib/jquery.min.js"></script>
<script src="js/mobile-db.js"></script>
<script src="js/mobile-ai.js"></script>
<script src="js/mobile-tts.js"></script>
<script src="js/mobile-apputil.js"></script>
<script src="db/DBPerguntas.js"></script>
<script src="js/ai.js"></script>
<script src="js/tts.js"></script>
<script>
(function () {
  'use strict';

  /* ================= idioma ============================================= */
  var LANG_LABEL = { pt: 'PT', en: 'EN', pa: 'ਪੰਜਾਬੀ' };
  var currentLang = (function () {
    var l = 'pt';
    try { l = localStorage.getItem('sr_lang') || 'pt'; } catch (e) {}
    return (l === 'en' || l === 'pa') ? l : 'pt';
  })();

  var I18N = {
    pt: {
      title: 'Config IA', back: 'Voltar', owner: 'Lakhwinder Singh',
      cpy: 'Copyright © 2026 — Todos os direitos reservados.',
      lEndpoint: 'Endpoint', lEndpointHint: 'URL da API compatível com OpenAI (chat/completions).',
      lModel: 'Modelo', lApiKey: 'Chave da API', lApiKeyHint: 'Guardada apenas neste dispositivo.',
      lIncludeImage: 'Enviar imagem', lIncludeImageHint: 'Inclui a imagem da pergunta no pedido à IA.',
      lMaxTokens: 'Máx. tokens', lTemperature: 'Temperatura', lTemperatureHint: '0 = preciso · 1 = criativo.',
      save: 'Guardar', test: 'Testar ligação', saved: '✓ Configuração guardada.',
      testRunning: 'A testar ligação…', testOk: '✓ Ligação OK — resposta da IA recebida.',
      noKey: 'Introduza primeiro a chave da API (Config IA) para testar a ligação.',
      testErr: '✗ Erro: ',
      lDefaultLang: 'Idioma por omissão', langNote: 'O idioma escolhido aplica-se a todos os ecrãs da aplicação.',
      aboutDb: 'Base de dados: ', questions: 'perguntas',
      loadingCfg: 'A carregar configuração…'
    },
    en: {
      title: 'AI Config', back: 'Back', owner: 'Lakhwinder Singh',
      cpy: 'Copyright © 2026 — All rights reserved.',
      lEndpoint: 'Endpoint', lEndpointHint: 'OpenAI-compatible API URL (chat/completions).',
      lModel: 'Model', lApiKey: 'API key', lApiKeyHint: 'Stored only on this device.',
      lIncludeImage: 'Send image', lIncludeImageHint: 'Includes the question image in the AI request.',
      lMaxTokens: 'Max tokens', lTemperature: 'Temperature', lTemperatureHint: '0 = precise · 1 = creative.',
      save: 'Save', test: 'Test connection', saved: '✓ Configuration saved.',
      testRunning: 'Testing connection…', testOk: '✓ Connection OK — AI response received.',
      noKey: 'Enter the API key first (AI Settings) to test the connection.',
      testErr: '✗ Error: ',
      lDefaultLang: 'Default language', langNote: 'The chosen language applies to all app screens.',
      aboutDb: 'Database: ', questions: 'questions',
      loadingCfg: 'Loading configuration…'
    },
    pa: {
      title: 'ਏਆਈ ਸੈਟਿੰਗਾਂ', back: 'ਵਾਪਸ', owner: 'ਲਖਵਿੰਦਰ ਸਿੰਘ',
      cpy: 'ਕਾਪੀਰਾਈਟ © 2026 — ਸਾਰੇ ਹੱਕ ਰਾਖਵੇਂ ਹਨ।',
      lEndpoint: 'ਐਂਡਪੁਆਇੰਟ', lEndpointHint: 'OpenAI-ਅਨੁਕੂਲ API URL (chat/completions)।',
      lModel: 'ਮਾਡਲ', lApiKey: 'API ਕੁੰਜੀ', lApiKeyHint: 'ਸਿਰਫ਼ ਇਸ ਡਿਵਾਈਸ ਤੇ ਸੁਰੱਖਿਅਤ।',
      lIncludeImage: 'ਚਿੱਤਰ ਭੇਜੋ', lIncludeImageHint: 'ਪ੍ਰਸ਼ਨ ਦੀ ਤਸਵੀਰ ਨੂੰ AI ਬੇਨਤੀ ਵਿੱਚ ਸ਼ਾਮਲ ਕਰਦਾ ਹੈ।',
      lMaxTokens: 'ਵੱਧ ਤੋਂ ਵੱਧ ਟੋਕਨ', lTemperature: 'ਤਾਪਮਾਨ', lTemperatureHint: '0 = ਸਹੀ · 1 = ਰਚਨਾਤਮਕ।',
      save: 'ਸੇਵ ਕਰੋ', test: 'ਕਨੈਕਸ਼ਨ ਜਾਂਚੋ', saved: '✓ ਸੰਰਚਨਾ ਸੇਵ ਹੋ ਗਈ।',
      testRunning: 'ਕਨੈਕਸ਼ਨ ਜਾਂਚਿਆ ਜਾ ਰਿਹਾ ਹੈ…', testOk: '✓ ਕਨੈਕਸ਼ਨ ਠੀਕ — AI ਜਵਾਬ ਮਿਲਿਆ।',
      noKey: 'ਕਨੈਕਸ਼ਨ ਜਾਂਚਣ ਲਈ ਪਹਿਲਾਂ API ਕੁੰਜੀ ਦਰਜ ਕਰੋ।',
      testErr: '✗ ਗਲਤੀ: ',
      lDefaultLang: 'ਮੂਲ ਭਾਸ਼ਾ', langNote: 'ਚੁਣੀ ਭਾਸ਼ਾ ਐਪ ਦੇ ਸਾਰੇ ਸਕ੍ਰੀਨਾਂ ਤੇ ਲਾਗੂ ਹੁੰਦੀ ਹੈ।',
      aboutDb: 'ਡਾਟਾਬੇਸ: ', questions: 'ਪ੍ਰਸ਼ਨ',
      loadingCfg: 'ਸੰਰਚਨਾ ਲੋਡ ਹੋ ਰਹੀ ਹੈ…'
    }
  };

  function t(key) {
    var d = I18N[currentLang] || I18N.pt;
    return (d[key] !== undefined) ? d[key] : I18N.pt[key];
  }

  /* ================= renderização ======================================= */
  function renderStatic() {
    var ids = ['title','back','owner','cpy','lEndpoint','lEndpointHint','lModel','lApiKey',
      'lApiKeyHint','lIncludeImage','lIncludeImageHint','lMaxTokens','lTemperature',
      'lTemperatureHint','save','test','lDefaultLang','langNote','aboutDb'];
    ids.forEach(function (id) {
      var el = document.getElementById(id === 'title' ? 'pageTitle' : id);
      if (el) el.textContent = t(id) + (id === 'aboutDb' ? '—' : '');
    });
    document.getElementById('langBtn').textContent = LANG_LABEL[currentLang];
    document.getElementById('backBtn').setAttribute('aria-label', t('back'));
    document.getElementById('backBtn').title = t('back');
    document.querySelectorAll('#langSeg button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
    });
  }

  /* ================= formulário ========================================= */
  function showResult(cls, html) {
    var r = document.getElementById('testResult');
    r.className = 'test-result ' + cls;
    r.innerHTML = html;
  }

  function readForm() {
    return {
      endpoint: document.getElementById('fEndpoint').value.trim(),
      model: document.getElementById('fModel').value.trim(),
      apiKey: document.getElementById('fApiKey').value.trim(),
      includeImage: document.getElementById('fIncludeImage').checked,
      maxTokens: parseInt(document.getElementById('fMaxTokens').value, 10) || 1800,
      temperature: parseFloat(document.getElementById('fTemperature').value),
      customPrompt: document.getElementById('fCustomPrompt').value.trim()
    };
  }

  function fillForm(cfg) {
    document.getElementById('fEndpoint').value = cfg.endpoint || '';
    document.getElementById('fModel').value = cfg.model || '';
    document.getElementById('fApiKey').value = (cfg.apiKey && cfg.apiKey !== 'PASTE_YOUR_API_KEY_HERE') ? cfg.apiKey : '';
    document.getElementById('fIncludeImage').checked = cfg.includeImage !== false;
    document.getElementById('fMaxTokens').value = cfg.maxTokens || 1800;
    document.getElementById('fTemperature').value = (cfg.temperature !== undefined) ? cfg.temperature : 0.2;
    document.getElementById('fCustomPrompt').value = cfg.customPrompt || '';
  }

  /* ================= arranque =========================================== */
  function boot() {
    var ready = (typeof window.dbReady === 'function')
      ? window.dbReady()
      : new Promise(function (resolve, reject) {
          var n = 0;
          (function poll() {
            if (typeof window.db !== 'undefined' && typeof window.db.exec === 'function') return resolve();
            if (++n > 300) return reject(Error('db timeout'));
            setTimeout(poll, 100);
          })();
        });

    var timeout = new Promise(function (_, reject) {
      setTimeout(function () { reject(Error('db timeout')); }, 30000);
    });

    Promise.race([ready, timeout])
      .then(async function () {
        try {
          var cfg = await window.AI.getConfig();
          fillForm(cfg);
        } catch (e) {
          /* formulário fica vazio; o utilizador pode preencher à mão */
        }
        try {
          var rows = await window.db.exec('SELECT COUNT(*) AS total FROM perguntas', 'get');
          if (rows && rows.length) {
            document.getElementById('aboutDb').textContent =
              t('aboutDb') + Number(rows[0].total) + ' ' + t('questions');
          }
        } catch (e) { /* contagem opcional */ }
      })
      .catch(function () {
        showResult('err', t('testErr') + 'database');
      });
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderStatic();

    document.getElementById('langBtn').addEventListener('click', function () {
      currentLang = (currentLang === 'pt') ? 'en' : (currentLang === 'en') ? 'pa' : 'pt';
      try { localStorage.setItem('sr_lang', currentLang); } catch (e) {}
      renderStatic();
    });

    document.querySelectorAll('#langSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        currentLang = b.getAttribute('data-lang');
        try { localStorage.setItem('sr_lang', currentLang); } catch (e) {}
        renderStatic();
      });
    });

    document.getElementById('backBtn').addEventListener('click', function () {
      window.location.href = 'menu.html';
    });

    document.getElementById('aiForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var cfg = readForm();
      try {
        var clean = await window.AI.saveConfig(cfg);
        fillForm(clean);
        showResult('ok', t('saved'));
      } catch (err) {
        showResult('err', t('testErr') + String(err && err.message || err));
      }
    });

    document.getElementById('testBtn').addEventListener('click', async function () {
      var cfg = readForm();
      if (!cfg.apiKey || cfg.apiKey === 'PASTE_YOUR_API_KEY_HERE') {
        showResult('err', t('noKey'));
        return;
      }
      /* grava primeiro para o teste usar a configuração em edição */
      try {
        await window.AI.saveConfig(cfg);
      } catch (e) { /* continua */ }

      showResult('ok', t('testRunning'));
      try {
        var res = await window.AI.check({
          questions: [{
            id: 1,
            pergunta: '1+1?',
            answers: ['2', '3', '4', '5'],
            correct: 'A'
          }]
        });
        showResult('ok', t('testOk') + '<br><small>' +
          String(res).replace(/</g, '&lt;').slice(0, 220) + '</small>');
      } catch (err) {
        showResult('err', t('testErr') + String(err && err.message || err));
      }
    });

    boot();
  });
})();
</script>
</body>
</html>
