<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conteúdo offline</title><link rel="stylesheet" href="css/mobile-base.css"></head><body><header class="app-bar"><button class="lang-btn" onclick="history.back()">‹</button><div class="app-title">Conteúdo offline</div></header><main class="page"><section class="card"><h2>Base de perguntas</h2><p id="db">A verificar…</p></section><section class="card"><h2>Imagens</h2><p id="images">A verificar…</p><button id="install" class="btn btn-primary" hidden>Descarregar / reparar imagens</button></section><section class="card"><h2>Atualizações</h2><p>Esta versão mantém o conteúdo e progresso guardados no dispositivo. Uma futura atualização de conteúdo será validada antes de substituir ficheiros.</p></section></main><script src="js/mobile-db.js"></script><script src="js/image-pack.js"></script><script>(async function(){try{await dbReady();var q=await db.exec('SELECT COUNT(*) total FROM perguntas','get');document.getElementById('db').textContent=Number(q[0].total).toLocaleString('pt-PT')+' perguntas disponíveis offline.';var s=IMTImagePack.isNative()?await IMTImagePack.status():null;images.textContent=s&&s.installed?(s.imageCount||0)+' imagens verificadas e disponíveis.':'As imagens podem ser descarregadas para utilização offline.';install.hidden=!!(s&&s.installed);install.onclick=async function(){install.disabled=true;try{await IMTImagePack.install(function(){});location.reload();}catch(e){images.textContent='Não foi possível instalar: '+e.message;install.disabled=false;}};}catch(e){db.textContent='Falha de verificação: '+e.message;}})();</script></body></html>
