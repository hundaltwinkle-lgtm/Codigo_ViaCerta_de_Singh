<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b52f2a">
<meta name="mobile-web-app-capable" content="yes">
<title>IMT_27 Código</title>
<link rel="stylesheet" href="css/mobile-base.css">
<link rel="stylesheet" href="css/menu.css">
<script src="js/access-control.js"></script>
</head>
<body class="safe-top safe-bottom">

<header class="app-bar">
  <button class="icon-btn" id="backBtn" type="button" aria-label="Voltar" title="Voltar">&#8249;</button>
  <div class="app-title" id="pageTitle">—</div>
  <span class="spacer"></span>
  <button class="lang-btn" id="langBtn" type="button">PT</button>
  <button class="icon-btn" id="settingsBtn" type="button" aria-label="Configuração IA" title="Config IA">&#9881;</button>
</header>

<main class="page" id="main">
  <div class="page-loader" id="loadingRow"><div class="loader-orbit" aria-hidden="true"></div><strong id="loadingText">A carregar…</strong><span>A preparar as perguntas desta categoria</span><div class="page-load-track"><i></i></div></div>
</main>

<footer class="footer">
  <div class="owner" id="footerOwner">Lakhwinder Singh</div>
  <div id="footerCpy">Copyright © 2026 — Todos os direitos reservados.</div>
</footer>

<!-- Ordem de carregamento (bridge): jquery -> mobile-db -> mobile-ai ->
     mobile-tts -> mobile-apputil -> DBPerguntas -> ai.js -> tts.js -->
<script src="lib/jquery.min.js"></script>
<script src="js/mobile-db.js"></script>
<script src="js/mobile-ai.js"></script>
<script src="js/mobile-tts.js"></script>
<script src="js/mobile-apputil.js"></script>
<script src="db/DBPerguntas.js"></script>
<script src="js/ai.js"></script>
<script src="js/tts.js"></script>
<script>
(function () {
  'use strict';

  /* ================= idioma ============================================= */
  var LANG_CYCLE = { pt: 'en', en: 'pa', pa: 'pt' };
  var LANG_LABEL = { pt: 'PT', en: 'EN', pa: 'ਪੰਜਾਬੀ' };
  var currentLang = (function () {
    var l = 'pt';
    try { l = localStorage.getItem('sr_lang') || 'pt'; } catch (e) {}
    return (l === 'en' || l === 'pa') ? l : 'pt';
  })();

  var I18N = {
    pt: {
      loading: 'A carregar…', back: 'Voltar', settingsAria: 'Configuração IA',
      owner: 'Lakhwinder Singh', cpy: 'Copyright © 2026 — Todos os direitos reservados.',
      questions: 'perguntas', exam: 'Teste de Exame', examSub: 'Prova completa da categoria',
      fixed: 'Teste Fixo', fixedSub: 'Prova com número fixo de perguntas',
      themeTitle: 'Escolha o Tema', specTitle: 'Específicas', commonTitle: 'Comuns',
      noTests: 'Não existem testes disponíveis para esta categoria.',
      errDb: 'Não foi possível efetuar ligação com a base de dados.',
      qOf: 'perguntas'
    },
    en: {
      loading: 'Loading…', back: 'Back', settingsAria: 'AI Settings',
      owner: 'Lakhwinder Singh', cpy: 'Copyright © 2026 — All rights reserved.',
      questions: 'questions', exam: 'Exam Test', examSub: 'Full paper for this category',
      fixed: 'Fixed Test', fixedSub: 'Paper with a fixed number of questions',
      themeTitle: 'Choose the Theme', specTitle: 'Specific', commonTitle: 'Common',
      noTests: 'No tests available for this category.',
      errDb: 'Could not connect to the database.',
      qOf: 'questions'
    },
    pa: {
      loading: 'ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ…', back: 'ਵਾਪਸ', settingsAria: 'ਏਆਈ ਸੈਟਿੰਗਾਂ',
      owner: 'ਲਖਵਿੰਦਰ ਸਿੰਘ', cpy: 'ਕਾਪੀਰਾਈਟ © 2026 — ਸਾਰੇ ਹੱਕ ਰਾਖਵੇਂ ਹਨ।',
      questions: 'ਪ੍ਰਸ਼ਨ', exam: 'ਇਮਤਿਹਾਨ ਟੈਸਟ', examSub: 'ਸ਼੍ਰੇਣੀ ਦਾ ਪੂਰਾ ਪੇਪਰ',
      fixed: 'ਫਿਕਸ ਟੈਸਟ', fixedSub: 'ਨਿਸ਼ਚਿਤ ਗਿਣਤੀ ਦੇ ਪ੍ਰਸ਼ਨਾਂ ਵਾਲਾ ਪੇਪਰ',
      themeTitle: 'ਵਿਸ਼ਾ ਚੁਣੋ', specTitle: 'ਖਾਸ', commonTitle: 'ਆਮ',
      noTests: 'ਇਸ ਸ਼੍ਰੇਣੀ ਲਈ ਕੋਈ ਟੈਸਟ ਉਪਲਬਧ ਨਹੀਂ ਹਨ।',
      errDb: 'ਡਾਟਾਬੇਸ ਨਾਲ ਕਨੈਕਸ਼ਨ ਨਹੀਂ ਹੋ ਸਕਿਆ।',
      qOf: 'ਪ੍ਰਸ਼ਨ'
    }
  };

  function t(key) {
    var d = I18N[currentLang] || I18N.pt;
    return (d[key] !== undefined) ? d[key] : I18N.pt[key];
  }

  var CAT_NAMES = {
    pt: {
      1: 'Categoria AM', 2: 'Categoria A e A2', 3: 'Categoria B e B1',
      4: 'Categoria C e C1', 5: 'Categoria D e D1', 6: 'Categoria A e A1',
      7: 'CAM / Mercadorias', 8: 'CAM / Passageiros', 9: 'TVDE', 10: 'Táxi'
    },
    en: {
      1: 'Category AM', 2: 'Category A and A2', 3: 'Category B and B1',
      4: 'Category C and C1', 5: 'Category D and D1', 6: 'Category A and A1',
      7: 'CAM / Goods', 8: 'CAM / Passengers', 9: 'TVDE', 10: 'Taxi'
    },
    pa: {
      1: 'ਸ਼੍ਰੇਣੀ AM', 2: 'ਸ਼੍ਰੇਣੀ A ਅਤੇ A2', 3: 'ਸ਼੍ਰੇਣੀ B ਅਤੇ B1',
      4: 'ਸ਼੍ਰੇਣੀ C ਅਤੇ C1', 5: 'ਸ਼੍ਰੇਣੀ D ਅਤੇ D1', 6: 'ਸ਼੍ਰੇਣੀ A ਅਤੇ A1',
      7: 'CAM / ਮਾਲ', 8: 'CAM / ਯਾਤਰੀ', 9: 'TVDE', 10: 'ਟੈਕਸੀ'
    }
  };

  function catName(id) {
    var d = CAT_NAMES[currentLang] || CAT_NAMES.pt;
    return (d[id] !== undefined) ? d[id] : CAT_NAMES.pt[id];
  }

  /* ================= estado da página =================================== */
  var URL_VARS = (function () {
    var q = window.location.search || '';
    return q.charAt(0) === '?' ? q.substring(1).split(',') : [];
  })();
  var catId = URL_VARS[0] ? parseInt(URL_VARS[0], 10) : null;
  if (catId && window.IMTAccess && !window.IMTAccess.allowed(catId)) window.location.replace('menu.html');

  var state = {
    catId: catId,
    testType: null,      /* escolhido automaticamente (1 SR preferido) */
    catRow: null,        /* getCurrentCat[0] */
    themeCounts: {}      /* "qcat:tema" -> total real de perguntas */
  };

  function examHref(varsArr) {
    var parts = [String(varsArr[0]), String(varsArr[1]), '0'];
    for (var i = 3; i < 7; i++) parts.push(varsArr[i] !== undefined ? String(varsArr[i]) : '');
    parts.push(currentLang);
    return 'exam.html?' + parts.join(',');
  }

  /* ================= renderização ======================================= */
  function renderStatic() {
    var ids = ['langBtn', 'loadingText', 'backBtn', 'settingsBtn', 'footerOwner', 'footerCpy', 'pageTitle'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (!el) { console.error('[categories] renderStatic missing #' + ids[i]); continue; }
      if (ids[i] === 'langBtn') el.textContent = LANG_LABEL[currentLang];
      else if (ids[i] === 'loadingText') el.textContent = t('loading');
      else if (ids[i] === 'backBtn') { el.setAttribute('aria-label', t('back')); el.title = t('back'); }
      else if (ids[i] === 'settingsBtn') el.setAttribute('aria-label', t('settingsAria'));
      else if (ids[i] === 'footerOwner') el.textContent = t('owner');
      else if (ids[i] === 'footerCpy') el.textContent = t('cpy');
      else if (ids[i] === 'pageTitle') el.textContent =
        (state.catId !== null) ? catName(state.catId) + ' · IMT_27' : 'IMT_27 Código';
    }
  }

  function rowHTML(icon, iconCls, title, sub, badgeText, chevron) {
    return '<div class="row-ico ' + (iconCls || '') + '">' + icon + '</div>'
      + '<div class="row-body"><div class="row-title"></div><div class="row-sub"></div></div>'
      + (badgeText !== undefined && badgeText !== null && badgeText !== ''
          ? '<div class="badge"></div>' : '')
      + '<span class="chev">' + (chevron || '›') + '</span>';
  }

  function fillRow(el, title, sub, badgeText) {
    el.querySelector('.row-title').textContent = title;
    el.querySelector('.row-sub').textContent = sub || '';
    var b = el.querySelector('.badge');
    if (b) b.textContent = badgeText;
  }

  function themeName(row) {
    if (currentLang === 'pt') return String(row.nome || '').replace(/<br\s*\/?\s*>/gi, ' ');
    var en = row.nome_en || '';
    if (currentLang === 'en') return String(en).replace(/<br\s*\/?\s*>/gi, ' ');
    /* PA: sem coluna _pa em tema — usa a designação PT como fallback */
    return String(row.nome || '').replace(/<br\s*\/?\s*>/gi, ' ');
  }

  function sectionTitle(key) {
    var h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = t(key);
    return h;
  }

  function appendList() {
    var main = document.getElementById('main');
    var list = document.createElement('div');
    list.className = 'list';
    main.appendChild(list);
    return list;
  }

  function renderThemes(qCat, sectionKey, isSpecial) {
    var main = document.getElementById('main');
    var list = appendList();
    list.appendChild(sectionTitle(sectionKey));

    var themes = (state.themes && state.themes['q' + qCat]) || [];
    themes.forEach(function (th) {
      var el = document.createElement('div');
      el.className = 'row';
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.innerHTML = rowHTML('📚', '', '', '', '', '');
      var n = state.themeCounts[qCat + ':' + th.tema];
      fillRow(el, themeName(th), t('questions'),
        (n !== undefined && n !== null) ? String(n) : String(th.numPergs || ''));
      var varsArr;
      if (isSpecial) {
        varsArr = [qCat, state.testType, '0', th.tema, 'spec=' + state.catId];
      } else {
        varsArr = [qCat, state.testType, '0', th.tema];
      }
      el.addEventListener('click', function () {
        window.location.href = examHref(varsArr);
      });
      list.appendChild(el);
    });
  }

  /* ================= arranque =========================================== */
  function fatal(msg) {
    var main = document.getElementById('main');
    main.innerHTML = '<div class="note" id="errNote"></div>';
    document.getElementById('errNote').textContent = msg || t('errDb');
  }

  function pickTestType(avail) {
    /* Prefere Segurança Rodoviária (1) sempre que a categoria tenha
       perguntas desse tipo; senão IMT (9). (Desktop usa opDefault — na
       BD enviada opDefault='9' em todas as categorias, mas SR é o tipo
       da marca e o mais testado no fluxo móvel.) */
    if (avail['1'] > 0) return 1;
    if (avail['9'] > 0) return 9;
    return (state.catRow && String(state.catRow.opDefault) === '9') ? 9 : 1;
  }

  function showTestTypePicker(avail) {
    var main = document.getElementById('main');
    main.innerHTML = '';
    var panel = document.createElement('div');
    panel.className = 'page-loader type-picker';
    panel.innerHTML = '<strong>Escolha o tipo de teste</strong><span>Selecione a base de perguntas que pretende praticar.</span>';
    [[1, 'Segurança Rodoviária'], [9, 'IMT']].forEach(function (choice) {
      if (!(avail[String(choice[0])] > 0)) return;
      var button = document.createElement('button');
      button.className = 'btn btn-primary'; button.textContent = choice[1];
      button.addEventListener('click', function () { state.testType = choice[0]; boot(); });
      panel.appendChild(button);
    });
    main.appendChild(panel);
  }

  function boot() {
    var ready = (typeof window.dbReady === 'function')
      ? window.dbReady()
      : new Promise(function (resolve, reject) {
          var n = 0;
          (function poll() {
            if (typeof window.db !== 'undefined' && typeof window.db.exec === 'function') return resolve();
            if (++n > 300) return reject(Error('db timeout'));
            setTimeout(poll, 100);
          })();
        });

    var timeout = new Promise(function (_, reject) {
      setTimeout(function () { reject(Error('db timeout')); }, 30000);
    });

    Promise.race([ready, timeout])
      .then(async function () {
        if (state.catId === null || isNaN(state.catId)) {
          fatal(t('errDb'));
          return;
        }

        var cur = await getCurrentCat(state.catId);
        state.catRow = (cur && cur.length) ? cur[0] : null;

        /* disponibilidade de perguntas por tipoteste (1 = SR, 9 = IMT) */
        var avail = {};
        try {
          var rows = await window.db.exec(
            'SELECT tipoteste, count(id) AS total FROM perguntas WHERE categoria = ' +
            state.catId + ' GROUP BY tipoteste', 'get'
          );
          rows.forEach(function (r) { avail[r.tipoteste] = Number(r.total) || 0; });
        } catch (e) { avail = {}; }

        if (avail['1'] > 0 && avail['9'] > 0 && state.testType === null) {
          showTestTypePicker(avail);
          return;
        }
        state.testType = state.testType || pickTestType(avail);

        renderStatic();
        var main = document.getElementById('main');
        main.innerHTML = '';

        var gotRow = false;

        /* --- Teste de Exame (prova completa) --- */
        if (!state.catRow || Number(state.catRow.opTesteExame) !== 0) {
          var list = appendList();
          var ex = document.createElement('div');
          ex.className = 'row primary-row';
          ex.setAttribute('role', 'button');
          ex.setAttribute('tabindex', '0');
          ex.innerHTML = rowHTML('📝', 'red', '', '', '', '');
          fillRow(ex, t('exam') + ' — ' + catName(state.catId), t('examSub'),
            state.catRow ? String(state.catRow.num_perguntas || 0) : '');
          ex.addEventListener('click', function () {
            window.location.href = examHref([state.catId, state.testType, '0', '', '', '', '']);
          });
          list.appendChild(ex);
          gotRow = true;
        }

        /* --- Teste Fixo (nº de prova) --- */
        var list2 = appendList();
        var fx = document.createElement('div');
        fx.className = 'row';
        fx.setAttribute('role', 'button');
        fx.setAttribute('tabindex', '0');
        fx.innerHTML = rowHTML('🎯', 'amber', '', '', '', '');
        fillRow(fx, t('fixed'), t('fixedSub'), null);
        fx.addEventListener('click', function () {
          window.location.href = 'options.html?' + state.catId + ',' + state.testType;
        });
        list2.appendChild(fx);
        gotRow = true;

        /* --- Testes Temáticos --- */
        if (!state.catRow || Number(state.catRow.opTesteTematico) !== 0) {
          if (state.catId === 6) {
            /* A/A1: desktop separa Específicas (cat 2) + Comuns (cat 3) */
            await loadThemeGroup(2);
            await loadThemeGroup(3);
          } else {
            await loadThemeGroup(state.catId);
          }
        }

        if (!gotRow) {
          main.innerHTML = '';
          var note = document.createElement('div');
          note.className = 'note';
          note.textContent = t('noTests');
          main.appendChild(note);
        }
      })
      .catch(function (e) {
        console.error('[categories] boot error:', e && e.stack || e);
        fatal(t('errDb'));
      });
  }

  async function loadThemeGroup(qCat) {
    var themes = [];
    try {
      themes = await getThemesByCatId(qCat, state.testType);
    } catch (e) { themes = []; }
    if (!themes || !themes.length) return;

    if (!state.themes) state.themes = {};
    state.themes['q' + qCat] = themes;

    /* contagens reais de perguntas por tema (para os badges) */
    try {
      var rows = await window.db.exec(
        'SELECT tema, count(id) AS total FROM perguntas WHERE categoria = ' +
        qCat + ' AND tipoteste = ' + state.testType + ' GROUP BY tema', 'get'
      );
      rows.forEach(function (r) {
        state.themeCounts[qCat + ':' + r.tema] = Number(r.total) || 0;
      });
    } catch (e) {}

    renderThemes(qCat, state.catId === 6 ? (qCat === 2 ? 'specTitle' : 'commonTitle') : 'themeTitle',
      state.catId === 6);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('langBtn').addEventListener('click', function () {
      currentLang = LANG_CYCLE[currentLang];
      try { localStorage.setItem('sr_lang', currentLang); } catch (e) {}
      renderStatic();
      /* reconstruir a lista no novo idioma */
      boot();
    });
    document.getElementById('backBtn').addEventListener('click', function () {
      window.location.href = 'menu.html';
    });
    document.getElementById('settingsBtn').addEventListener('click', function () {
      window.location.href = 'settings.html';
    });
    renderStatic();
    boot();
  });
})();
</script>
</body>
</html>
