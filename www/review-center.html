<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Revisão</title><link rel="stylesheet" href="css/mobile-base.css"><style>.row{padding:13px;margin:9px 14px}.row b{display:block}.row small{color:var(--text-soft)}</style></head><body><header class="app-bar"><button class="lang-btn" onclick="history.back()">‹</button><div class="app-title">Centro de revisão</div></header><main class="page"><section class="card"><h2 style="margin-top:0">Revisão inteligente</h2><p id="intro">A carregar…</p><button class="btn btn-primary" onclick="location='menu.html'">Praticar por categoria</button></section><section id="list"></section><p class="muted" style="margin:14px">As perguntas erradas voltam mais cedo; respostas corretas repetidas aumentam o intervalo de revisão.</p></main><script src="js/mobile-db.js"></script><script src="js/mobile-learning.js"></script><script>(async function(){var d=await IMTLearning.dashboard(),t=await IMTLearning.topics();intro.textContent=d.due?d.due+' perguntas vencidas para hoje.':'Ainda não há perguntas vencidas. Termine um teste para começar.';list.innerHTML=t.map(function(x){return '<div class="card row"><b>'+String(x.name||'Tema')+'</b><small>'+Number(x.due||0)+' para rever · '+Number(x.accuracy||0)+'% de acerto</small></div>';}).join('')||'<div class="card muted">Sem histórico de revisão ainda.</div>'; }());</script></body></html>
