<script>
/* =====================================================================
   exam.html — teste de exame (versão móvel SR Testes Código)
   ---------------------------------------------------------------------
   URL vars (espelham testes_exame_teste_codigo1.html do desktop):
     vars[0]=cat  vars[1]=testType  vars[2]=autoMode  vars[3]=tema (-1/'' = exame completo)
     vars[4]=subtema(s) 'a_or_b' | 'test=N' | 'spec=...'   vars[5]=allSubthemesSel | spec
     vars[6]=spec   vars[7]=lang (detectLanguage percorre todos)
   Paper building = replica fiel do UpdateTeste/writeQs do desktop
   (mesmas funções DBPerguntas, mesmos limites por tema/subtema,
    mesmo keepQorder/ansersKeeper -> a revisão casa com o desktop).
   ===================================================================== */
'use strict';

/* ---------- deteção de idioma + espera pela BD (padrão do desktop) ---------- */
function detectLanguage(varsArr) {
  if (typeof varsArr == 'undefined' || !varsArr) return 'pt';
  for (var i = varsArr.length - 1; i >= 0; i--) {
    var value = String(varsArr[i] || '').trim().toLowerCase();
    if (value === 'pt' || value === 'en' || value === 'pa') return value;
  }
  return 'pt';
}
function waitForDb(callback, attempt) {
  attempt = attempt || 0;
  if (window.db && typeof window.db.exec === 'function') { callback(); return; }
  if (attempt >= 300) {
    showFatal('Não foi possível efetuar ligação com a base de dados');
    return;
  }
  setTimeout(function () { waitForDb(callback, attempt + 1); }, 100);
}
function setLoadProgress(percent, message) {
  var fill = document.querySelector('.ex-load-fill');
  if (fill) fill.style.width = Math.max(4, Math.min(100, Number(percent) || 4)) + '%';
  if (message && $id('loadSub')) $id('loadSub').textContent = message;
}

/* ---------- dicionário de UI (PT/EN/PA) ---------- */
var UI = {
  pt: {

    noQuestions: 'No questions found for this selection.',
    question: 'Question', dbNum: 'No.', answered: 'answered', of: '/',
    finish: 'Finish Test', cancel: 'Cancel', yes: 'Yes', abandon: 'Abandon test?',
    finishMsg: 'Your answers will be saved and shown in the result.',
    abandonMsg: 'The test will be abandoned and your answers lost.',

    loadError: 'Error preparing the test', weakPractice: 'Mistake review', correctNow: 'Correct — keep going.', wrongNow: 'Not quite. The correct answer is highlighted.'
  },
  pa: {
    testTypeSR: 'ਸੜਕ ਸੁਰੱਖਿਆ', testTypeIMT: 'IMT',
    testTitle: 'ਟੈਸਟ', preparing: 'ਤੁਹਾਡਾ ਟੈਸਟ ਤਿਆਰ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ', organising: 'ਸਵਾਲਾਂ ਦਾ ਪ੍ਰਬੰਧ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ…',
    noQuestions: 'ਇਸ ਚੋਣ ਲਈ ਕੋਈ ਸਵਾਲ ਨਹੀਂ ਮਿਲੇ।',
    question: 'ਸਵਾਲ', dbNum: 'ਨੰ.', answered: 'ਜਵਾਬ ਦਿੱਤੇ', of: '/',
    finish: 'ਟੈਸਟ ਖਤਮ ਕਰੋ', cancel: 'ਰੱਦ ਕਰੋ', yes: 'ਹਾਂ', abandon: 'ਟੈਸਟ ਛੱਡਣਾ ਹੈ?',
    finishMsg: 'ਤੁਹਾਡੇ ਜਵਾਬ ਸੰਭਾਲ ਲਏ ਜਾਣਗੇ ਅਤੇ ਨਤੀਜੇ ਵਿੱਚ ਦਿਖਾਏ ਜਾਣਗੇ।',
    abandonMsg: 'ਟੈਸਟ ਛੱਡ ਦਿੱਤਾ ਜਾਵੇਗਾ ਅਤੇ ਜਵਾਬ ਗੁਆਚ ਜਾਣਗੇ।',
    confirmFinish: 'ਟੈਸਟ ਖਤਮ ਕਰਨਾ ਹੈ?', backToMenu: 'ਮੀਨੂ', exit: 'ਬਾਹਰ',
    imageMissing: 'ਤਸਵੀਰ ਉਪਲਬਧ ਨਹੀਂ ਹੈ',
    timeUp: 'ਸਮਾਂ ਖਤਮ। ਟੈਸਟ ਸੰਭਾਲਿਆ ਜਾ ਰਿਹਾ ਹੈ…',
    loadError: 'ਟੈਸਟ ਤਿਆਰ ਕਰਨ ਵਿੱਚ ਗਲਤੀ', weakPractice: 'ਗਲਤੀਆਂ ਦੀ ਸਮੀਖਿਆ', correctNow: 'ਸਹੀ — ਇੰਝ ਹੀ ਜਾਰੀ ਰੱਖੋ।', wrongNow: 'ਇਹ ਸਹੀ ਨਹੀਂ। ਸਹੀ ਜਵਾਬ ਹਾਈਲਾਈਟ ਕੀਤਾ ਗਿਆ ਹੈ।'
  }
};
function ui(key) { return (UI[currentLang] && UI[currentLang][key]) || UI.pt[key] || key; }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ---------- vars de URL + estado global (mesmos nomes do desktop) ---------- */
var url = window.location.href;
var variables = url.split('?');
var vars = ((variables[1] || '') + '').split(',');
var practiceMode = vars.some(function (v) { return String(v || '').indexOf('practice=') === 0; });
var weakMode = vars.some(function (v) { return String(v || '') === 'weak=1'; });
var catSpecialA1 = '';
if (window.IMTAccess && !window.IMTAccess.allowed(vars[0])) window.location.replace('menu.html');
var currentCat = [];
var currentCatObj = {};
var pergActual = 1, autoModeTime = 0, timeOnWatch = 0;
var KeepAnswers = [];      /* index = n.º da pergunta; valor = LETRA ORIGINAL escolhida */
var KeepQuestions = [];    /* index = n.º da pergunta; valor = q_id */
var keepQorder = [];       /* index = n.º da pergunta; valor = ordem "C##A##B##D" (letras originais) */
var countNumQts = 0;
var masterQArray = [], masterQOrder = [];
var enabledLangEN = 1;
var currentLang = 'pt';
var paperTitle = '';

(function () {
  var detected = detectLanguage(vars);
  var saved = null;
  try { saved = localStorage.getItem('sr_lang'); } catch (e) { /* sem localStorage */ }
  currentLang = detected !== 'pt' ? detected : (saved || 'pt');
  if (['pt', 'en', 'pa'].indexOf(currentLang) < 0) currentLang = 'pt';
})();

/* ---------- pequenos helpers ---------- */
function $id(id) { return document.getElementById(id); }
function showFatal(msg) {
  var el = $id('loading');
  if (el) el.innerHTML = '<h2>' + escapeHtml(msg) + '</h2>';
}
function setSlideTexts(l) {
  var q = masterQArray[l];
  if (!q) return;
  var slide = $id('exSlide_' + (l + 1));
  if (!slide) return;
  var qa = slide.querySelector('.t-box-info-question-area');
  if (qa) { qa.innerHTML = textFor(q, 'pergunta'); }
  var letters = (masterQOrder[l + 1] || 'a##b##c').split('##');
  var tv = slide.querySelectorAll('.t-question-area-text-v');
  for (var i = 0; i < letters.length && i < tv.length; i++) {
    tv[i].innerHTML = textFor(q, 'resposta_' + letters[i].toLowerCase());
  }
  if (typeof ttsDecorateSlide == 'function') ttsDecorateSlide(l);
  reapplyKeepAnswers();
}
function reapplyKeepAnswers() {
  var slide = $id('exSlide_' + pergActual);
  if (!slide) return;
  var chosen = KeepAnswers[pergActual];
  var rows = slide.querySelectorAll('.t-question-area');
  for (var i = 0; i < rows.length; i++) {
    var f = String(rows[i].id || '').split('_');
    var isChosen = (f.length >= 3 && f[1] === chosen);
    rows[i].classList.toggle('t-question-area-active', isChosen);
    var line = rows[i].querySelector('.t-question-area-line-v');
    if (line) line.classList.toggle('t-question-area-answer-active', isChosen);
  }
  if (practiceMode && chosen) revealPractice(pergActual, chosen);
}

function revealPractice(index, selectedOriginal) {
  if (!practiceMode) return;
  var q = masterQArray[index - 1];
  var slide = $id('exSlide_' + index);
  if (!q || !slide) return;
  var correct = String(q.correcta || '').toUpperCase();
  var selected = String(selectedOriginal || '').toUpperCase();
  var rows = slide.querySelectorAll('.t-question-area');
  for (var i = 0; i < rows.length; i++) {
    rows[i].classList.remove('practice-ok', 'practice-bad');
    var f = String(rows[i].id || '').split('_');
    var original = String(f[1] || '').toUpperCase();
    if (original === correct) rows[i].classList.add('practice-ok');
    else if (original === selected && selected !== correct) rows[i].classList.add('practice-bad');
  }
  var fb = $id('practiceFeedback_' + index);
  if (fb) {
    var ok = selected === correct;
    fb.hidden = false;
    fb.className = 'practice-feedback ' + (ok ? 'ok' : 'bad');
    fb.textContent = ok ? ui('correctNow') : ui('wrongNow');
  }
}
function updateLangSwitchLabel() {
  var el = $id('langSwitch');
  if (el) el.textContent = currentLang.toUpperCase() + ' | ' + langCycle().toUpperCase();
}
function langCycle() { return currentLang == 'pt' ? 'en' : (currentLang == 'en' ? 'pa' : 'pt'); }
function persistLang() { try { localStorage.setItem('sr_lang', currentLang); } catch (e) { /* ignore */ } }

/* ---------- troca de idioma (MASTER SET, sem recarregar perguntas) ---------- */
var fillQueueRunning = false;

function switchLang() {
  currentLang = langCycle();
  persistLang();
  updateLangSwitchLabel();
  mergeLangFromDB();
  for (var l = 0; l < masterQArray.length; l++) setSlideTexts(l);
  refreshUIStrings();
  if (currentLang == 'en' || currentLang == 'pa') startFillQueue();
}
function refreshUIStrings() {
  $id('exTitle').textContent = paperTitle;
  $id('loadTitle').textContent = ui('preparing');
  $id('loadSub').textContent = ui('organising');
  $id('finalBtn').textContent = ui('finish');
  $id('prevBtn').textContent = '\u2190'; $id('nextBtn').textContent = '\u2192';
  if (typeof updateStripCounters == 'function') updateStripCounters();
}
function mergeLangFromDB() {
  if (currentLang != 'pa') return;
  var ids = [];
  for (var l = 0; l < masterQArray.length; l++) {
    if (masterQArray[l] && masterQArray[l].q_id) ids.push(masterQArray[l].q_id);
  }
  if (!ids.length) return;
  getQuestionsPA(ids.join(',')).then(function (rows) {
    var map = {};
    rows.forEach(function (r) { map[r.id] = r; });
    for (var l = 0; l < masterQArray.length; l++) {
      var q = masterQArray[l], r = q ? map[q.q_id] : null;
      if (!q || !r) continue;
      if (validText(r.pergunta_pa)) q.pergunta_pa = r.pergunta_pa;
      if (validText(r.resposta_a_pa)) {
        q.resposta_a_pa = r.resposta_a_pa; q.resposta_b_pa = r.resposta_b_pa;
        q.resposta_c_pa = r.resposta_c_pa; q.resposta_d_pa = r.resposta_d_pa;
      }
    }
    for (var l2 = 0; l2 < masterQArray.length; l2++) setSlideTexts(l2);
  }).catch(function () { /* sem PA em cache: mantém PT */ });
}
function startFillQueue() {
  if (fillQueueRunning) return;
  fillQueueRunning = true;
  (async function () {
    var order = [pergActual - 1];
    for (var l = 0; l < masterQArray.length; l++) if (order.indexOf(l) == -1) order.push(l);
    for (var o = 0; o < order.length; o++) {
      var l = order[o], q = masterQArray[l];
      if (!q) continue;
      if (currentLang == 'en' ? validText(q.pergunta_en) : validText(q.pergunta_pa)) continue;
      try {
        var d = await getQuestionAI(q);
        applyAIToQuestion(q, d);
        if (currentLang != 'pt') setSlideTexts(l);
      } catch (e) { /* sem IA configurada/offline: mantém PT */ }
    }
    fillQueueRunning = false;
  })();
}

/* ---------- hooks do painel de explicação IA (js/ai.js) ---------- */
var ttsOrderFn = null; /* global declarado (tts.js consulta typeof ttsOrderFn) */
function getQuestionForAI(n) {
  var q = masterQArray[n - 1];
  if (!q) return null;
  return { id: q.q_id, q_id: q.q_id, pergunta: q.pergunta, pergunta_en: q.pergunta_en,
    pergunta_pa: q.pergunta_pa, resposta_a: q.resposta_a, resposta_b: q.resposta_b,
    resposta_c: q.resposta_c, resposta_d: q.resposta_d,
    resposta_a_en: q.resposta_a_en, resposta_b_en: q.resposta_b_en,
    resposta_c_en: q.resposta_c_en, resposta_d_en: q.resposta_d_en,
    resposta_a_pa: q.resposta_a_pa, resposta_b_pa: q.resposta_b_pa,
    resposta_c_pa: q.resposta_c_pa, resposta_d_pa: q.resposta_d_pa,
    correcta: q.correcta, explicacao_ok: q.explicacao_ok,
    explicacao_pt: q.explicacao_pt, explicacao_en: q.explicacao_en, explicacao_pa: q.explicacao_pa,
    imagePath: q.imagePath || '', imagem: q.imagem || '' };
}
function onQuestionTranslated(n) {
  if (currentLang == 'en' || currentLang == 'pa') setSlideTexts(n - 1);
}
/* No teste ao vivo o chip abre o modal de explicação (PT/EN/PA + ouvir).
   Definir showInlineAIExplanation mantém os chips SEMPRE clicáveis
   (regra do desktop: num teste ao vivo o pedido é feito ao clicar). */
function showInlineAIExplanation(n) { openAIModal(n); }

/* ---------- TTS (construção da ordem original por slide) ---------- */
ttsOrderFn = function (l, i) {
  var letters = (masterQOrder[l + 1] || 'a##b##c').split('##');
  return letters[i] ? letters[i].toLowerCase() : null;
};

/* =====================================================================
   UPDATE TESTE — réplica do desktop (UpdateTeste + writeQs)
   ===================================================================== */
var counter = 1;
var keepQArray = [];

function decryptSN(toDecrypt) { return toDecrypt; }

function questaoFromRow(element, imagePath) {
  var questao = {};
  questao.q_id = element.id;
  questao.q_num = element.numero;
  questao.pergunta = element.pergunta;
  questao.pergunta_en = element.pergunta_en;
  questao.resposta_a = element.resposta_a;
  questao.resposta_a_en = element.resposta_a_en;
  questao.resposta_b = element.resposta_b;
  questao.resposta_b_en = element.resposta_b_en;
  questao.resposta_c = element.resposta_c;
  questao.resposta_c_en = element.resposta_c_en;
  questao.resposta_d = element.resposta_d;
  questao.resposta_d_en = element.resposta_d_en;
  questao.imagem = element.imagem;
  questao.imagem_en = element.imagem_en;
  questao.imagePath = imagePath;
  if (enabledLangEN == 1 && currentLang == 'en') {
    questao.pergunta_en = element.pergunta_en;
    questao.resposta_a_en = element.resposta_a_en;
    questao.resposta_b_en = element.resposta_b_en;
    questao.resposta_c_en = element.resposta_c_en;
    questao.imagem_en = element.imagem_en;
  }
  return questao;
}

async function loadWeakPractice() {
  if (!weakMode) return false;
  var ids = (window.IMTLearning && window.IMTLearning.mistakeIds)
    ? window.IMTLearning.mistakeIds(Number(currentCatObj.catId), Number(currentCatObj.testType)) : [];
  if (!ids.length) { showFatal(ui('noQuestions')); return true; }
  /* IDs come only from our local learning profile; force numeric values. */
  ids = ids.map(function (x) { return Number(x); }).filter(function (x) { return isFinite(x) && x > 0; });
  if (!ids.length) { showFatal(ui('noQuestions')); return true; }
  var sql = 'SELECT id, numero, pergunta, resposta_a, resposta_b, resposta_c, resposta_d, '
    + 'pergunta_en, resposta_a_en, resposta_b_en, resposta_c_en, resposta_d_en, imagem, imagem_en, correcta '
    + 'FROM perguntas WHERE categoria=' + Number(currentCatObj.catId)
    + ' AND tipoteste=' + Number(currentCatObj.testType) + ' AND id IN (' + ids.join(',') + ')';
  var rows = await window.db.exec(sql, 'get');
  if (!rows || !rows.length) { showFatal(ui('noQuestions')); return true; }
  var order = {};
  ids.forEach(function (id, i) { order[id] = i; });
  rows.sort(function (a, b) { return (order[a.id] || 0) - (order[b.id] || 0); });
  var originalCount = Math.max(1, Number(currentCatObj.NumberOfQuestions) || rows.length);
  var take = Math.min(originalCount, rows.length);
  rows = rows.slice(0, take);
  currentCatObj.NumberOfQuestions = take;
  timeOnWatch = Math.max(5, Math.ceil((Number(currentCatObj.timeCat) || 30) * take / originalCount));
  paperTitle = ui('weakPractice');
  $id('exTitle').textContent = paperTitle;
  var arr = rows.map(function (r) { return questaoFromRow(r, currentCatObj.imagePath); });
  await writeQs(arr);
  return true;
}
window.loadPractice = loadWeakPractice;

async function UpdateTeste() {
  setLoadProgress(18, ui('organising'));
  keepQArray = [];
  countNumQts = 0;
  counter = 1;
  currentCat = await getCurrentCat(vars[0]);
  currentCat.forEach(function (element) {
    currentCatObj.catId = vars[0];
    currentCatObj.catIdA = 2;
    currentCatObj.catIdB = 3;
    currentCatObj.subCatId = 0;
    currentCatObj.NumberOfQuestions = element.num_perguntas;
    currentCatObj.timeCat = element.tempo;
    currentCatObj.color = element.cor;
    currentCatObj.tema = -1;
    currentCatObj.subtema = -1;
    currentCatObj.test = -1;
    currentCatObj.testType = vars[1];
    currentCatObj.autoMode = vars[2];
    currentCatObj.allSubthemesSel = 0;
    currentCatObj.isTest = 0;
    currentCatObj.proLine = element.proline;
    currentCatObj.imagePath = '';
    currentCatObj.catName = element.nome;
    currentCatObj.pergAprov = element.pergAprov;
  });

  var langRows = await getPermitions('Lang_EN');
  langRows.forEach(function (element) { enabledLangEN = element.enabled; });

  currentCatObj.tema = (vars[3] != null && vars[3] != '') ? vars[3] : -1;

  if (vars[4] != null && vars[4] != '') {
    if (vars[4].split('=')[0] == 'test') {
      currentCatObj.test = vars[4].split('=')[1];
    } else if (vars[4].split('=')[0] == 'spec') {
      currentCatObj.subtema = -1;
      catSpecialA1 = ',spec=' + vars[4].split('=')[1];
    } else {
      currentCatObj.subtema = vars[4];
    }
  }

/* =====================================================================
   WRITEQS — constrói os slides + ordem das respostas (replica desktop)
   ===================================================================== */
async function writeQs(tempQArray) {
  setLoadProgress(62, 'A preparar as perguntas e respostas…');
  var keepQArrayL = [];
  var keepQArrayTemp = [];
  if (currentCatObj.test == -1 || currentCatObj.isTest == '1') {
    keepQArrayTemp = tempQArray.slice();
    var num = keepQArrayTemp.length;
    for (var j = 0; j < num; j++) {
      var indice = Math.floor(Math.random() * keepQArrayTemp.length);
      keepQArrayL.push(keepQArrayTemp[indice]);
      keepQArrayTemp.splice(indice, 1);
    }
  } else {
    keepQArrayL = tempQArray;
  }
  keepQArrayL = keepQArrayL.filter(function (q) { return q && q.q_id != null; });
  if (currentCatObj && currentCatObj.NumberOfQuestions) keepQArrayL = keepQArrayL.slice(0, Number(currentCatObj.NumberOfQuestions));

  if (!keepQArrayL.length) { showFatal(ui('noQuestions')); return; }

  var html = '';
  for (var l = 0, la = keepQArrayL.length; l < la; l++) {
    var q = keepQArrayL[l];
    if (!q) continue;

    /* baralhar respostas (letras originais guardadas em keepQorder) */
    var answersRandom = [textFor(q, 'resposta_a'), textFor(q, 'resposta_b'), textFor(q, 'resposta_c')];
    var answersRandomL = ['A', 'B', 'C'];
    if (textFor(q, 'resposta_d') != '') { answersRandom.push(textFor(q, 'resposta_d')); answersRandomL.push('D'); }
    var answersKeeperR = [], answersKeeperRL = [];
    for (var j = 0, ja = answersRandom.length; j < ja; j++) {
      var indice = Math.floor(Math.random() * answersRandom.length);
      if (answersRandom[indice] != '') {
        answersKeeperR.push(answersRandom[indice]);
        answersKeeperRL.push(answersRandomL[indice]);
      }
      answersRandom.splice(indice, 1);
      answersRandomL.splice(indice, 1);
    }

    /* linhas de resposta: linha inteira = botão (A..D) */
    var rowsHTML = '';
    for (var a = 0; a < answersKeeperR.length; a++) {
      rowsHTML += '<div class="t-question-area" id="Resp_' + answersKeeperRL[a] + '_' + (l + 1) + '" role="button" tabindex="0">'
        + '<div class="t-question-area-line"><div class="t-question-area-line-v">' + String.fromCharCode(65 + a) + '</div></div>'
        + '<div class="t-question-area-text"><div class="t-question-area-text-v">' + answersKeeperR[a] + '</div></div>'
        + '<div class="clear"></div></div>';
    }

    var noImg = !(q.imagem != null && q.imagem != '' && q.imagem != 'null');
    var imgBlock = noImg ? '' : ('<div class="ex-img-wrap" id="exImgWrap_' + (l + 1) + '">'
      + '<img class="ex-img" id="exImg_' + (l + 1) + '" src="assets/' + q.imagePath + q.imagem + '.jpg" data-imt-image="' + q.imagePath + q.imagem + '.jpg" alt="" '
      + 'onerror="this.style.display=\'none\';var p=document.getElementById(\'exImgPh_' + (l + 1) + '\');if(p)p.style.display=\'flex\';">'
      + '<div class="ex-img-ph" id="exImgPh_' + (l + 1) + '" style="display:none">'
      + '<span class="ex-img-ph-ic">&#128444;</span><span>' + ui('imageMissing') + '</span></div></div>');

    html += '<div class="ex-slide showcase-slide" id="exSlide_' + (l + 1) + '" data-n="' + (l + 1) + '" style="display:none">'
      + '<div class="ex-card">'
      + '<div class="ex-card-head"><span class="ex-qnum">' + ui('question') + ' ' + (l + 1) + ' <span class="muted">' + ui('of') + ' ' + la + '</span></span>'
      + '<span class="ex-qnum-db muted">' + ui('dbNum') + ' ' + (q.q_num != null ? q.q_num : '') + '</span></div>'
      + imgBlock
      + '<div class="t-box-info-question-area"></div>'
      + '<div class="ex-answers">' + rowsHTML + '</div>'
      + '<div class="practice-feedback" id="practiceFeedback_' + (l + 1) + '" hidden></div>'
      + aiChipHTML(l + 1)
      + '</div></div>';

    keepQorder[l + 1] = answersKeeperRL.join('##');
    KeepQuestions[l + 1] = q.q_id;
    countNumQts++;
  }

  $id('showcase').innerHTML = html;
  if (window.IMTImagePack) window.IMTImagePack.hydrate($id('showcase'));
  setLoadProgress(82, 'A finalizar o teste…');

  /* MASTER SET: guarda a lista carregada para troca de idioma sem recarregar */
  masterQArray = keepQArrayL.slice(0);
  masterQOrder = keepQorder.slice(0);
  /* enriquece com o estado IA da BD (contrato do getQuestionForAI: explicacao_*,
     _pa) — uma leitura barata por pergunta, ignorada se offline */
  if (typeof getAIState == 'function') {
    try {
      var aiRows = await Promise.all(masterQArray.map(function (q) { return getAIState(q.q_id); }));
      aiRows.forEach(function (st, i) {
        if (st && st.length) {
          var row = st[0], q = masterQArray[i];
          for (var f in row) { if (row[f] != null && q[f] === undefined) q[f] = row[f]; }
        }
      });
    } catch (eAI) { /* sem estado IA — contratos opcionais */ }
  }

  /* TTS: letra original de cada resposta por slide */
  ttsOrderFn = function (l, i) {
    var letters = (masterQOrder[l + 1] || 'a##b##c').split('##');
    return letters[i] ? letters[i].toLowerCase() : null;
  };

  /* desenhar textos; TTS decora depois de tudo montado */
  for (var l2 = 0; l2 < masterQArray.length; l2++) setSlideTexts(l2);
  if (typeof ttsDecorate == 'function') ttsDecorate();
  if (typeof refreshAllAIChips == 'function') refreshAllAIChips();

  renderStrip();
  $id('loading').style.display = 'none';
  $id('showcase').style.display = 'block';
  $id('stripWrap').style.display = 'block';
  $id('exBottom').style.display = 'flex';
  showSlide(1);
  startExamClock(timeOnWatch);
  if (currentCatObj.autoMode != 0) { setTimeout(autoModeTest, autoModeTime); }
  /* teste iniciado em EN/PA: traduzir já as perguntas carregadas */
  if (currentLang == 'en' || currentLang == 'pa') startFillQueue();
}

/* ---------- navegação ---------- */
function showSlide(n) {
  if (n < 1 || n > countNumQts) return;
  pergActual = n;
  var slides = document.querySelectorAll('#showcase .ex-slide');
  for (var i = 0; i < slides.length; i++) {
    slides[i].style.display = (i === n - 1) ? 'block' : 'none';
  }
  var dots = document.querySelectorAll('#numStrip .ex-dot');
  for (var d = 0; d < dots.length; d++) {
    dots[d].classList.toggle('current', Number(dots[d].getAttribute('data-n')) === n);
  }
  $id('prevBtn').disabled = (n <= 1);
  $id('nextBtn').disabled = (n >= countNumQts);
  $id('exProgress').textContent = n + ui('of') + countNumQts;
  reapplyKeepAnswers();
  if (typeof ttsDecorateSlide == 'function') ttsDecorateSlide(n - 1);
}
function updateStripCounters() {
  var answered = 0;
  for (var i = 1; i <= countNumQts; i++) if (KeepAnswers[i]) answered++;
  $id('exAnswered').textContent = answered + ' ' + ui('answered');
  var dots = document.querySelectorAll('#numStrip .ex-dot');
  for (var d = 0; d < dots.length; d++) {
    var n = Number(dots[d].getAttribute('data-n'));
    dots[d].classList.toggle('answered', !!KeepAnswers[n]);
  }
}
function renderStrip() {
  var html = '';
  for (var i = 1; i <= countNumQts; i++) {
    html += '<button type="button" class="ex-dot" data-n="' + i + '">' + i + '</button>';
  }
  $id('numStrip').innerHTML = html;
}
function goPrev() { showSlide(pergActual - 1); }
function goNext() { showSlide(pergActual + 1); }

function autoModeTest() {
  if (parseInt(pergActual) < parseInt(currentCatObj.NumberOfQuestions)) {
    setTimeout(autoModeTest, autoModeTime);
  }
  goNext();
}

/* ---------- seleção de resposta (mesmo esquema de id do desktop) ---------- */
document.addEventListener('click', function (e) {
  if (e.target.closest('.tts-btn')) return; /* o alto-falante não escolhe resposta */
  var row = e.target.closest('.t-question-area');
  if (!row) return;
  var f = String(row.id || '').split('_');
  if (f.length < 3) return;
  var index = Number(f[2]);
  if (!index) return;
  if (practiceMode && KeepAnswers[index]) return; /* learning mode locks the first answer */
  var wasActive = row.classList.contains('t-question-area-active');
  var scope = row.closest('.ex-slide') || document;
  var active = scope.querySelectorAll('.t-question-area-active');
  for (var i = 0; i < active.length; i++) {
    active[i].classList.remove('t-question-area-active');
    var line = active[i].querySelector('.t-question-area-line-v');
    if (line) line.classList.remove('t-question-area-answer-active');
  }
  if (wasActive) {
    KeepAnswers[index] = '';
  } else {
    row.classList.add('t-question-area-active');
    var lin = row.querySelector('.t-question-area-line-v');
    if (lin) lin.classList.add('t-question-area-answer-active');
    KeepAnswers[index] = f[1];
    if (practiceMode) revealPractice(index, f[1]);
  }
  updateStripCounters();
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var row = e.target.closest && e.target.closest('.t-question-area');
  if (row) { e.preventDefault(); row.click(); }
});
document.addEventListener('click', function (e) {
  var dot = e.target.closest && e.target.closest('.ex-dot');
  if (dot) showSlide(Number(dot.getAttribute('data-n')));
});

/* zoom de imagem sem sair do teste */
document.addEventListener('click', function (e) {
  var img = e.target.closest && e.target.closest('.ex-img');
  if (!img || !img.src) return;
  var z = document.getElementById('imageZoomOverlay');
  if (!z) {
    z = document.createElement('div'); z.id = 'imageZoomOverlay'; z.className = 'image-zoom-overlay';
    z.innerHTML = '<button type="button" class="image-zoom-close" aria-label="Close">×</button><img alt="">';
    z.addEventListener('click', function (ev) { if (ev.target === z || ev.target.closest('.image-zoom-close')) z.classList.remove('open'); });
    document.body.appendChild(z);
  }
  z.querySelector('img').src = img.src; z.classList.add('open');
});

/* ---------- relógio (wall-clock, igual ao exam_clock.js do desktop) ---------- */
var _deadline = 0, _clockHandle = null, _clockFinished = false;
function formatExamTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));
  return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
}
function _clockTick() {
  var seconds = Math.max(0, Math.ceil((_deadline - Date.now()) / 1000));
  var el = $id('div_final');
  if (el) {
    el.textContent = formatExamTime(seconds);
    el.style.fontVariantNumeric = 'tabular-nums';
    el.classList.toggle('ex-timer-low', seconds <= 60);
  }
  if (seconds === 0) {
    clearInterval(_clockHandle);
    if (!_clockFinished) { _clockFinished = true; finishTest(true); }
  }
}
function startExamClock(minutes) {
  if (_clockHandle) clearInterval(_clockHandle);
  _clockFinished = false;
  _deadline = Date.now() + Math.max(0, Number(minutes) || 0) * 60000;
  _clockTick();
  if (!_clockFinished) _clockHandle = setInterval(_clockTick, 250);
}
window.addEventListener('pagehide', function () { if (_clockHandle) clearInterval(_clockHandle); });

/* ---------- terminar / abandonar ---------- */
var _confirmCb = null;
function openConfirm(title, msg, cb) {
  $id('dlgTitle').textContent = title;
  $id('dlgMsg').textContent = msg;
  _confirmCb = cb;
  $id('confirmDlg').style.display = 'flex';
}
function closeConfirm() { $id('confirmDlg').style.display = 'none'; _confirmCb = null; }
$id('dlgCancel').addEventListener('click', closeConfirm);
$id('dlgOk').addEventListener('click', function () { var cb = _confirmCb; closeConfirm(); if (cb) cb(); });

$id('finalBtn').addEventListener('click', function () {
  openConfirm(ui('confirmFinish'), ui('finishMsg'), function () { finishTest(false); });
});

var _finishing = false;
async function finishTest(fromTimer) {
  if (_finishing) return;
  _finishing = true;
  if (_clockHandle) clearInterval(_clockHandle);
  if (fromTimer) { try { $id('loadSub').textContent = ui('timeUp'); } catch (e) { /* ignore */ } }
  var dl = $id('loading');
  if (dl) { dl.style.display = 'block'; $id('showcase').style.display = 'none'; }
  try { await validateAnswers(); }
  catch (err) {
    console.error('[exam] Erro ao gravar respostas:', err);
    _finishing = false;
    if (dl) dl.style.display = 'none';
    if ($id('showcase')) $id('showcase').style.display = 'block';
    alert(String(err && err.message || err).slice(0, 200));
  }
}

async function validateAnswers() {
  var answers = await setAnswersSafe(KeepAnswers, KeepQuestions, keepQorder, currentCatObj.NumberOfQuestions);
  var answersId = -1;
  answers.forEach(function (element) { answersId = element.id; });

  /* Backup independente da leitura SQLite: reproduz exatamente o formato
     que setAnswersSafe grava. Isto evita perder o resultado quando a escrita
     nativa ainda está a ser descarregada para disco durante a navegação. */
  try {
    var _backupParts = [];
    for (var _b = 1; _b <= currentCatObj.NumberOfQuestions; _b++) {
      if (KeepQuestions[_b] != null && KeepQuestions[_b] !== '') {
        _backupParts[_b] = (KeepAnswers[_b] || '') + ',' + KeepQuestions[_b] + ','
          + currentCatObj.NumberOfQuestions + ',' + (keepQorder[_b] || '') + ';';
      }
    }
    var _directPayload = String(_backupParts);
    sessionStorage.setItem('sr_result_answers_' + answersId, _directPayload);
    localStorage.setItem('sr_result_answers_' + answersId, _directPayload);
  } catch (eBackup) { console.warn('[exam] backup direto falhou:', eBackup && eBackup.message || eBackup); }

  /* Rede de segurança do desktop: se a gravação saiu vazia mas havia respostas,
     gravar outra vez (evita resultado a 0 com a fila de tradução em simultâneo). */
  try {
    var _n = 0;
    for (var _i = 1; _i <= currentCatObj.NumberOfQuestions; _i++) { if (KeepAnswers[_i]) _n++; }
    if (_n > 0) {
      var _rows = await window.db.exec('select resultado from respostasUtilizador where id=' + answersId, 'get');
      var _txt = (_rows && _rows.length) ? String(_rows[0].resultado) : '';
      var _guardadas = 0;
      _txt.split(';').forEach(function (e) { var f = e.split(','); if (f.length > 1 && f[1] && f[1] !== '') _guardadas++; });
      if (_guardadas == 0) {
        answers = await setAnswersSafe(KeepAnswers, KeepQuestions, keepQorder, currentCatObj.NumberOfQuestions);
        answers.forEach(function (el) { answersId = el.id; });
      }
    }
  } catch (e) { /* sem problema: segue com o que foi gravado */ }

  /* A linha na SQLite é a fonte de verdade, mas a página seguinte pode abrir
     antes de uma escrita nativa terminar (ou em WebView sem Filesystem).
     Guardar a mesma carga nesta sessão torna a transição exam -> result
     independente dessa corrida; result.html só a usa se não encontrar a
     linha na BD. */
  try {
    var _answerRows = await window.db.exec('select resultado from respostasUtilizador where id=' + answersId, 'get');
    if (_answerRows && _answerRows.length && _answerRows[0].resultado != null) {
      sessionStorage.setItem('sr_result_answers_' + answersId, String(_answerRows[0].resultado));
      localStorage.setItem('sr_result_answers_' + answersId, String(_answerRows[0].resultado));
    }
  } catch (eSession) { console.warn('[exam] backup temporário das respostas falhou:', eSession && eSession.message || eSession); }

  var varsStr = vars[0] + ',' + vars[1] + ',' + vars[2] + ',' + vars[3] + ',' + answersId + catSpecialA1 + ',' + currentLang;
  if (vars.some(function (v) { return String(v || '').indexOf('practice=') === 0; })) varsStr += ',practice=1';
  /* Cada execução precisa de um token único: respostasUtilizador é esvaziada
     antes de inserir e o SQLite pode reutilizar o mesmo id entre testes. */
  varsStr += ',run=' + Date.now();
  /* IMPORTANTE: garantir que a base de dados está fisicamente gravada no
     armazenamento do Android ANTES de abrir a página de resultado. O
     result.html carrega a BD de novo do disco; se a gravação (debounced)
     ainda não tiver corrido, a linha do teste não existe lá e a página
     mostra 'Não foi possível ler as respostas do teste'. */
  if (window.db && typeof window.db.flush === 'function') {
    try { await window.db.flush(); } catch (eFlush) { console.warn('[exam] flush falhou:', eFlush && eFlush.message || eFlush); }
  }
  window.location.href = 'result.html?' + varsStr;
}

/* ---------- botão voltar (abandonar) ---------- */
$id('exBack').addEventListener('click', function () {
  openConfirm(ui('abandon'), ui('abandonMsg'), function () { window.location.href = 'menu.html'; });
});

$id('langSwitch').addEventListener('click', switchLang);
$id('prevBtn').addEventListener('click', goPrev);
$id('nextBtn').addEventListener('click', goNext);

/* ---------- boot ---------- */
setTimeout(function () {
  waitForDb(function () {
    UpdateTeste().catch(function (err) {
      console.error('[exam] Erro de arranque:', err);
      showFatal(ui('loadError') + ': ' + String(err && err.message || err).slice(0, 160));
    });
  });
}, 500);
</script>
