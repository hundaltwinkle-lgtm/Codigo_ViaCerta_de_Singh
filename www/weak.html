<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b4f8a">
<title>Rever erros — IMT_27 Código</title>
<link rel="stylesheet" href="css/mobile-base.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body class="safe-top safe-bottom">
<header class="app-bar">
  <button class="icon-btn" id="backBtn" type="button" aria-label="Voltar">&#8249;</button>
  <div class="app-title" id="pageTitle">Rever erros</div>
  <span class="spacer"></span>
  <button class="lang-btn" id="langBtn" type="button">PT</button>
</header>
<main class="page">
  <div class="learn-page-wrap">
    <section class="learn-summary-card">
      <h2 id="heroTitle">Pratique o que precisa</h2>
      <p id="heroText">As perguntas erradas voltam até ficarem dominadas.</p>
    </section>
    <div class="section-title" id="sectionTitle">Perguntas para rever</div>
    <div class="learn-list" id="weakList"></div>
  </div>
</main>
<script src="js/learning.js"></script>
<script>
(function(){
'use strict';
var LANG_CYCLE={pt:'en',en:'pa',pa:'pt'}, LANG_LABEL={pt:'PT',en:'EN',pa:'ਪੰਜਾਬੀ'};
var lang='pt'; try{lang=localStorage.getItem('sr_lang')||'pt';}catch(e){} if(['pt','en','pa'].indexOf(lang)<0)lang='pt';
var N={
 pt:{title:'Rever erros',hero:'Pratique o que precisa',text:'As perguntas erradas voltam até ficarem dominadas.',section:'Perguntas para rever',empty:'Ainda não existem erros para rever.',emptySub:'Faça um teste. As perguntas erradas aparecerão aqui automaticamente.',q:'perguntas',sr:'Segurança Rodoviária',imt:'IMT'},
 en:{title:'Review mistakes',hero:'Practise what needs work',text:'Wrong answers return until you master them.',section:'Questions to review',empty:'No mistakes to review yet.',emptySub:'Complete a test. Wrong questions will appear here automatically.',q:'questions',sr:'Road Safety',imt:'IMT'},
 pa:{title:'ਗਲਤੀਆਂ ਦੁਹਰਾਓ',hero:'ਜਿੱਥੇ ਲੋੜ ਹੈ ਉੱਥੇ ਅਭਿਆਸ ਕਰੋ',text:'ਗਲਤ ਸਵਾਲ ਦੁਬਾਰਾ ਆਉਂਦੇ ਹਨ ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਉਹਨਾਂ ਨੂੰ ਸਿੱਖ ਨਹੀਂ ਲੈਂਦੇ।',section:'ਦੁਹਰਾਉਣ ਵਾਲੇ ਸਵਾਲ',empty:'ਅਜੇ ਕੋਈ ਗਲਤੀ ਦੁਹਰਾਉਣ ਲਈ ਨਹੀਂ ਹੈ।',emptySub:'ਇੱਕ ਟੈਸਟ ਕਰੋ। ਗਲਤ ਸਵਾਲ ਇੱਥੇ ਆਪਣੇ ਆਪ ਆ ਜਾਣਗੇ।',q:'ਸਵਾਲ',sr:'ਸੜਕ ਸੁਰੱਖਿਆ',imt:'IMT'}
};
var C={
 pt:{1:'Categoria AM',2:'Categoria A e A2',3:'Categoria B e B1',4:'Categoria C e C1',5:'Categoria D e D1',7:'CAM / Mercadorias',8:'CAM / Passageiros',9:'TVDE',10:'Táxi'},
 en:{1:'Category AM',2:'Category A and A2',3:'Category B and B1',4:'Category C and C1',5:'Category D and D1',7:'CAM / Goods',8:'CAM / Passengers',9:'TVDE',10:'Taxi'},
 pa:{1:'ਸ਼੍ਰੇਣੀ AM',2:'ਸ਼੍ਰੇਣੀ A ਅਤੇ A2',3:'ਸ਼੍ਰੇਣੀ B ਅਤੇ B1',4:'ਸ਼੍ਰੇਣੀ C ਅਤੇ C1',5:'ਸ਼੍ਰੇਣੀ D ਅਤੇ D1',7:'CAM / ਮਾਲ',8:'CAM / ਯਾਤਰੀ',9:'TVDE',10:'ਟੈਕਸੀ'}
};
function t(k){return (N[lang]&&N[lang][k])||N.pt[k]||k;} function cn(id){return (C[lang]&&C[lang][id])||C.pt[id]||('Categoria '+id);}
function render(){
 document.getElementById('pageTitle').textContent=t('title'); document.getElementById('heroTitle').textContent=t('hero'); document.getElementById('heroText').textContent=t('text'); document.getElementById('sectionTitle').textContent=t('section'); document.getElementById('langBtn').textContent=LANG_LABEL[lang];
 var list=document.getElementById('weakList'); list.innerHTML='';
 var groups=window.IMTLearning?window.IMTLearning.weakGroups():[];
 if(!groups.length){list.innerHTML='<div class="learn-empty"><strong>'+t('empty')+'</strong><span>'+t('emptySub')+'</span></div>';return;}
 groups.forEach(function(g){
  var b=document.createElement('button'); b.type='button'; b.className='learn-list-row';
  var type=Number(g.testType)===9?t('imt'):t('sr');
  b.innerHTML='<span class="learn-list-ico">🎯</span><span class="learn-list-body"><strong></strong><span></span></span><span class="learn-pill bad"></span>';
  b.querySelector('strong').textContent=cn(g.catId); b.querySelector('.learn-list-body span').textContent=type; b.querySelector('.learn-pill').textContent=g.count+' '+t('q');
  b.onclick=function(){var v=[g.catId,g.testType||1,'0','','','weak=1','',lang,'practice=1']; location.href='exam.html?'+v.join(',');};
  list.appendChild(b);
 });
}
document.getElementById('backBtn').onclick=function(){location.href='menu.html';};
document.getElementById('langBtn').onclick=function(){lang=LANG_CYCLE[lang];try{localStorage.setItem('sr_lang',lang);}catch(e){}render();};
render();
})();
</script>
</body>
</html>
