<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b52f2a">
<meta name="mobile-web-app-capable" content="yes">
<title>Revisão — SR Testes Código</title>
<link rel="stylesheet" href="css/mobile-base.css">
<link rel="stylesheet" href="css/exam.css">
<!-- Ordre de carga (bridge): jquery -> mobile-db -> mobile-ai -> mobile-tts ->
     mobile-apputil -> DBPerguntas -> ai.js -> tts.js -> script da página -->
<script src="lib/jquery.min.js"></script>
<script src="js/mobile-db.js"></script>
<script src="js/mobile-ai.js"></script>
<script src="js/mobile-tts.js"></script>
<script src="js/mobile-apputil.js"></script>
<script src="js/image-pack.js"></script>
<script src="db/DBPerguntas.js"></script>
<script src="js/ai.js"></script>
<script src="js/tts.js"></script>
</head>
<body class="review-page">

<div class="app-bar ex-top safe-top">
  <button type="button" class="icon-btn" id="revBack" aria-label="Fechar">&#10005;</button>
  <div class="app-title" id="revTitle">Revisão</div>
  <button type="button" class="lang-btn" id="langSwitch">PT | EN</button>
</div>

<main class="page ex-main safe-bottom" id="revMain">
  <div id="loading" class="ex-loading">
    <div class="loader-orbit" aria-hidden="true"></div>
    <h2 id="loadTitle">A preparar a revisão</h2>
    <p id="loadSub">A carregar as respostas…</p>
  </div>
  <div class="rev-filters" id="revFilters" style="display:none">
    <button type="button" class="rev-filter active" data-f="all">Todas</button>
    <button type="button" class="rev-filter" data-f="bad">Erradas</button>
    <button type="button" class="rev-filter" data-f="ok">Certas</button>
  </div>
  <div class="rev-empty muted" id="filterEmpty" style="display:none">—</div>
  <div id="showcase" class="ex-showcase" style="display:none"></div>
  <div class="ex-strip-wrap" id="stripWrap" style="display:none">
    <div class="ex-strip" id="numStrip" role="tablist"></div>
  </div>
</main>

<div class="bottom-bar ex-bottom safe-bottom" id="revBottom" style="display:none">
  <button type="button" class="btn ex-nav" id="prevBtn" aria-label="Anterior">&#8592;</button>
  <div class="ex-progress"><span id="revProgress">1/31</span></div>
  <button type="button" class="btn ex-nav" id="nextBtn" aria-label="Seguinte">&#8594;</button>
  <button type="button" class="btn btn-primary" id="closeBtn">Fechar</button>
</div>

<script>

'use strict';

function detectLanguage(varsArr) {
  if (typeof varsArr == 'undefined' || !varsArr) return 'pt';
  for (var i = varsArr.length - 1; i >= 0; i--) {
    var value = String(varsArr[i] || '').trim().toLowerCase();
    if (value === 'pt' || value === 'en' || value === 'pa') return value;
  }
  return 'pt';
}
function waitForDb(callback, attempt) {
  attempt = attempt || 0;
  if (window.db && typeof window.db.exec === 'function') { callback(); return; }
  if (attempt >= 300) {
    var el = $id('loading');
    if (el) el.innerHTML = '<h2>Não foi possível efetuar ligação com a base de dados</h2>';
    return;
  }
  setTimeout(function () { waitForDb(callback, attempt + 1); }, 100);
}
function $id(id) { return document.getElementById(id); }
function showFatal(msg) { var el = $id('loading'); if (el) el.innerHTML = '<h2>' + escapeHtml(msg) + '</h2>'; }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

var UI = {
  pt: { title: 'Revisão', preparing: 'A preparar a revisão', loading: 'A carregar as respostas…',
    noQuestions: 'Sem perguntas para rever.', question: 'Pergunta', of: '/', dbNum: 'Nº',
    close: 'Fechar', all: 'Todas', bad: 'Erradas', ok: 'Certas',
    whyTitle: 'Porque está correcta', whyWaiting: 'A IA está a gerar esta explicação...', whyEmpty: 'A explicação ainda não está disponível.',
    imageMissing: 'Imagem não disponível', loadError: 'Erro a preparar a revisão', answered: 'respondidas' },
  en: { title: 'Review', preparing: 'Preparing review', loading: 'Loading your answers…',
    noQuestions: 'No questions to review.', question: 'Question', of: '/', dbNum: 'No.',
    close: 'Close', all: 'All', bad: 'Wrong', ok: 'Correct',
    whyTitle: 'Why this answer is correct', whyWaiting: 'AI is generating this explanation...', whyEmpty: 'Explanation not available yet.',
    imageMissing: 'Image not available', loadError: 'Error preparing review', answered: 'answered' },
  pa: { title: 'ਸਮੀਖਿਆ', preparing: 'ਸਮੀਖਿਆ ਤਿਆਰ ਕੀਤੀ ਜਾ ਰਹੀ ਹੈ', loading: 'ਜਵਾਬ ਲੋਡ ਕੀਤੇ ਜਾ ਰਹੇ ਹਨ…',
    noQuestions: 'ਸਮੀਖਿਆ ਲਈ ਕੋਈ ਸਵਾਲ ਨਹੀਂ।', question: 'ਸਵਾਲ', of: '/', dbNum: 'ਨੰ.',
    close: 'ਬੰਦ ਕਰੋ', all: 'ਸਾਰੇ', bad: 'ਗਲਤ', ok: 'ਸਹੀ',
    whyTitle: 'ਸਹੀ ਜਵਾਬ ਕਿਉਂ ਹੈ', whyWaiting: 'AI ਇਹ ਵਿਆਖਿਆ ਤਿਆਰ ਕਰ ਰਹੀ ਹੈ...', whyEmpty: 'ਵਿਆਖਿਆ ਅਜੇ ਉਪਲਬਧ ਨਹੀਂ ਹੈ।',
    imageMissing: 'ਤਸਵੀਰ ਉਪਲਬਧ ਨਹੀਂ ਹੈ', loadError: 'ਸਮੀਖਿਆ ਤਿਆਰ ਕਰਨ ਵਿੱਚ ਗਲਤੀ', answered: 'ਜਵਾਬ ਦਿੱਤੇ' }
};
function ui(key) { return (UI[currentLang] && UI[currentLang][key]) || UI.pt[key] || key; }

var url = window.location.href;
var variables = url.split('?');
var vars = ((variables[1] || '') + '').split(',');
var currentLang = 'pt', enabledLangEN = 1;

(function () {
  var detected = detectLanguage(vars);
  var saved = null;
  try { saved = localStorage.getItem('sr_lang'); } catch (e) { /* ignore */ }
  currentLang = detected !== 'pt' ? detected : (saved || 'pt');
  if (['pt', 'en', 'pa'].indexOf(currentLang) < 0) currentLang = 'pt';
})();

/* spec: o vars[5]=spec=X troca o cat do vars[0] (igual ao desktop) */
if (vars[5] != null && String(vars[5]).split('=')[0] == 'spec') {
  var subCatId = String(vars[5]).split('=')[1];
  vars[5] = 'spec=' + vars[0];
  vars[0] = subCatId;
}

var ajudaPerg = [];
var currentCat = [];
var catId = 0, NumberOfQuestions = 0, catName = '', timeCat = '', color = '', testType = 1, proline = 0;
var counter = 1;
var student = '';
var imagePath = '';
var KeepAnswers = [], KeepQuestions = [];
var reviewMaster = [];
var whyStore = {};
var fillQueueRunningReview = false;
var ttsOrderFn = null; /* global declarado (tts.js consulta typeof ttsOrderFn) */

var IdsArray = [], OrdArray = [], AnswerArray = [];
var respostas = '', respArray = '';
var questions = [];
var pergActual = 1;

function decryptSN(toDecrypt) { return toDecrypt; }
function validText(v) { return v != null && v != '' && v != 'ignorar' && v != 'null'; }

function langCycleReview() { return currentLang == 'pt' ? 'en' : (currentLang == 'en' ? 'pa' : 'pt'); }
function persistLang() { try { localStorage.setItem('sr_lang', currentLang); } catch (e) { /* ignore */ } }
function updateLangSwitchLabel() {
  var el = $id('langSwitch');
  if (el) el.textContent = currentLang.toUpperCase() + ' | ' + langCycleReview().toUpperCase();
}

async function UpdateRevisao() {
  try {
    var langRows = await getPermitions('Lang_EN');
    langRows.forEach(function (element) { enabledLangEN = element.enabled; });

    currentCat = await getCurrentCat(vars[0]);
    currentCat.forEach(function (element) {
      catId = vars[0];
      catName = element.nome;
      NumberOfQuestions = element.num_perguntas;
      timeCat = element.tempo;
      color = element.cor;
      testType = vars[1];
      proline = element.proline;
    });

    if (decryptSN(proline) == 2 && (catId == 2 || catId == 3 || catId == 6)) student = '_aluno';
    imagePath = 'testes_exame/tipo_' + testType + '_cat_' + catId + student + '/';

    var result = await getQuestionsResult2(vars[4]);
    if (!result.length || result[0].resultado == null || String(result[0].resultado) === '') {
      var cached = null;
      try { cached = sessionStorage.getItem('sr_result_answers_' + vars[4]); } catch (e) {}
      if (cached == null) { try { cached = localStorage.getItem('sr_result_answers_' + vars[4]); } catch (e2) {} }
      if (cached != null && String(cached) !== '') result = [{ resultado: String(cached) }];
    }
    if (!result.length || result[0].resultado == null || String(result[0].resultado) === '') { showFatal(ui('noQuestions')); return; }

    var idsStr = '(-1,null,' + vars[4] + ')';
    result.forEach(function (element) {
      var answers = element.resultado;
      var aswArr = String(answers || '').split(';');
      for (var k = 0; k < aswArr.length; k++) {
        var parts = aswArr[k].split(',');
        IdsArray[k] = parts[2];
        OrdArray[k] = parts[4];
        AnswerArray[k] = parts[1];
        if (IdsArray[k] == undefined || IdsArray[k] === '') IdsArray[k] = -1;
        idsStr += '_(' + IdsArray[k] + ', null, ' + vars[4] + ')';
      }
    });

    questions = await getQuestionsResult(idsStr, vars[4]);

    questions.forEach(function (element) {
      var q_id = element.id;
      var q_num = element.numero;
      respostas = OrdArray[counter - 1];
      respArray = String(respostas || '').toLowerCase().split('##');
      var catIdAux = element.categoria;

      var m = {
        q_id: q_id,
        q_num: q_num,
        pergunta: decryptSN(element.pergunta),
        resposta_a: decryptSN(element.resposta_a),
        resposta_b: decryptSN(element.resposta_b),
        resposta_c: decryptSN(element.resposta_c),
        resposta_d: decryptSN(element.resposta_d),
        pergunta_en: element.pergunta_en != null ? decryptSN(element.pergunta_en) : '',
        resposta_a_en: element.resposta_a_en != null ? decryptSN(element.resposta_a_en) : '',
        resposta_b_en: element.resposta_b_en != null ? decryptSN(element.resposta_b_en) : '',
        resposta_c_en: element.resposta_c_en != null ? decryptSN(element.resposta_c_en) : '',
        resposta_d_en: element.resposta_d_en != null ? decryptSN(element.resposta_d_en) : '',
        pergunta_pa: element.pergunta_pa != null ? decryptSN(element.pergunta_pa) : '',
        resposta_a_pa: element.resposta_a_pa != null ? decryptSN(element.resposta_a_pa) : '',
        resposta_b_pa: element.resposta_b_pa != null ? decryptSN(element.resposta_b_pa) : '',
        resposta_c_pa: element.resposta_c_pa != null ? decryptSN(element.resposta_c_pa) : '',
        resposta_d_pa: element.resposta_d_pa != null ? decryptSN(element.resposta_d_pa) : '',
        correcta: element.correcta,
        resposta: AnswerArray[counter - 1],
        imagem: element.imagem,
        ajuda: element.ajuda,
        respArray: respArray,
        counter: counter,
        ai: null
      };
      m.imagePath = 'testes_exame/tipo_' + testType + '_cat_' + catIdAux + student + '/';
      reviewMaster.push(m);
      ajudaPerg[counter] = element.ajuda;
      counter++;
    });

    /* enriquece com o estado IA da BD (contrato do getQuestionForAI: explicacao_*) */
    if (typeof getAIState == 'function') {
      try {
        var aiStates = await Promise.all(reviewMaster.map(function (m) { return getAIState(m.q_id); }));
        aiStates.forEach(function (st, i) {
          if (st && st.length) {
            var row = st[0], m = reviewMaster[i];
            for (var f in row) { if (row[f] != null && m[f] === undefined) m[f] = row[f]; }
          }
        });
      } catch (eAI) { /* sem estado IA — contratos opcionais */ }
    }

    if (!reviewMaster.length) { showFatal(ui('noQuestions')); return; }

    var html = '';
    reviewMaster.forEach(function (m) { html += buildReviewSlide(m); });
    $id('showcase').innerHTML = html;
    if (window.IMTImagePack) window.IMTImagePack.hydrate($id('showcase'));

    ttsOrderFn = function (l, i) {
      var m = reviewMaster[l];
      return (m && m.respArray && m.respArray[i]) ? m.respArray[i] : null;
    };
    if (typeof ttsDecorate == 'function') ttsDecorate();
    renderStrip();
    applyFilter('all');
    showSlide(1);

    resetTableTemp(vars[4]);

    if (typeof refreshAllAIChips == 'function') refreshAllAIChips();
    if (typeof startExplainFill == 'function') startExplainFill();

    if (currentLang == 'en' || currentLang == 'pa') startFillQueueReview();

    $id('loading').style.display = 'none';
    $id('showcase').style.display = 'block';
    $id('revFilters').style.display = 'flex';
    $id('stripWrap').style.display = 'block';
    $id('revBottom').style.display = 'flex';
    updateLangSwitchLabel();
  } catch (err) {
    console.error('[review] Erro:', err);
    showFatal(ui('loadError') + ': ' + String(err && err.message || err).slice(0, 160));
  }
}


function buildReviewSlide(m) {
  var imagePath = m.imagePath;
  var counter = m.counter;
  var html = '';
  var noImg = !(m.imagem != null && m.imagem != '' && m.imagem != 'null');
  var imgBlock = noImg ? '' : ('<div class="ex-img-wrap" id="exImgWrap_' + counter + '">'
    + '<img class="ex-img" id="exImg_' + counter + '" src="assets/' + imagePath + m.imagem + '.jpg" data-imt-image="' + imagePath + m.imagem + '.jpg" alt="" '
    + 'onerror="this.style.display=\'none\';var p=document.getElementById(\'exImgPh_' + counter + '\');if(p)p.style.display=\'flex\';">'
    + '<div class="ex-img-ph" id="exImgPh_' + counter + '" style="display:none">'
    + '<span class="ex-img-ph-ic">&#128444;</span><span>' + ui('imageMissing') + '</span></div></div>');

  html += '<div class="ex-slide showcase-slide" id="exSlide_' + counter + '" data-n="' + counter + '" data-ok="none" style="display:none">'
    + '<div class="ex-card">'
    + '<div class="ex-card-head"><span class="ex-qnum">' + ui('question') + ' ' + counter
    + ' <span class="muted">' + ui('of') + ' ' + reviewMaster.length + '</span></span>'
    + '<span class="ex-qnum-db muted">' + ui('dbNum') + ' ' + (m.q_num != null ? m.q_num : '') + '</span></div>'
    + imgBlock
    + '<div class="t-box-info-question-area">' + textFor(m, 'pergunta') + '</div>'
    + '<div class="ex-answers">';

  var letters = ['A', 'B', 'C', 'D'];
  for (var j = 0; j < m.respArray.length && j < 4; j++) {
    var l = m.respArray[j];
    if (!validText(m['resposta_' + l]) && !validText(m['resposta_' + l + '_en'])) continue;
    var row = drawResult(letters[j], textFor(m, 'resposta_' + l), m.resposta, m.correcta, counter, l.toUpperCase(), l);
    html += row.html;
  }
  var ua = String(m.resposta || '').toUpperCase();
  var ca = String(m.correcta || '').toUpperCase();
  var slideOk = ua ? (ua === ca ? 'ok' : 'bad') : 'none';
  html += '</div>'
    + aiChipHTML(counter)
    + '<div class="why-correct-row" id="why_' + counter + '" style="display:none;"></div>'
    + '</div></div>';

  html = html.replace('data-ok="none"', 'data-ok="' + slideOk + '"');
  return html;
}

function drawResult(letter, resposta_2, resposta, correcta, counter, letterA, lettera) {
  var result = '';
  var ok = false, bad = false;
  if (resposta_2 != '') {
    if (correcta == letterA || correcta == lettera) {
      ok = true;
      result += '<div class="t-question-area rev-ok"><div class="t-question-area-line"><div class="t-question-area-line-v">' + letter + '</div></div>'
        + '<div class="t-question-area-text"><div class="t-question-area-text-v">' + resposta_2 + '</div></div>'
        + '<div class="t-question-area-answer t-question-area-active" id="Respondido_' + letter + '_' + counter + '"></div><div class="clear"></div></div>';
    } else if (resposta == letterA || resposta == lettera) {
      bad = true;
      result += '<div class="t-question-area rev-bad"><div class="t-question-area-line"><div class="t-question-area-line-v">' + letter + '</div></div>'
        + '<div class="t-question-area-text"><div class="t-question-area-text-v">' + resposta_2 + '</div></div>'
        + '<div class="t-question-area-answer t-question-area-error" id="Respondido_' + letter + '_' + counter + '"></div><div class="clear"></div></div>';
    } else {
      result += '<div class="t-question-area"><div class="t-question-area-line"><div class="t-question-area-line-v">' + letter + '</div></div>'
        + '<div class="t-question-area-text"><div class="t-question-area-text-v">' + resposta_2 + '</div></div>'
        + '<div class="t-question-area-answer" id="Respondido_' + letter + '_' + counter + '"></div><div class="clear"></div></div>';
    }
  }
  return { html: result, ok: ok, bad: bad };
}


function reviewSlideEl(i) {
  var s = $id('exSlide_' + (i + 1));
  return s ? s : null;
}
function updateSlide(i) {
  var m = reviewMaster[i];
  var slide = reviewSlideEl(i);
  if (!m || !slide) return;
  var qa = slide.querySelector('.t-box-info-question-area');
  if (qa) qa.innerHTML = textFor(m, 'pergunta');
  var tv = slide.querySelectorAll('.t-question-area-text-v');
  for (var j = 0; j < m.respArray.length && j < tv.length; j++) {
    tv[j].innerHTML = textFor(m, 'resposta_' + m.respArray[j]);
  }
  if (typeof ttsDecorateSlide == 'function') ttsDecorateSlide(i);
  decorateSlideTTS(i, slide, i + 1);
  loadWhyCorrect(i);
}
function decorateSlideTTS(i, slide, n) {
  var qa = slide.querySelector('.t-box-info-question-area');
  if (qa && !qa.querySelector('.tts-btn')) {
    var b = document.createElement('span');
    b.className = 'tts-btn';
    b.innerHTML = '&#128266;';
    b.onclick = function () { ttsSayQ(n); };
    qa.insertBefore(b, qa.firstChild);
  }
  var tvs = slide.querySelectorAll('.t-question-area-text-v');
  for (var j = 0; j < tvs.length; j++) {
    if (tvs[j].querySelector('.tts-btn')) continue;
    var letter = (typeof ttsOrderFn == 'function') ? ttsOrderFn(i, j) : null;
    if (!letter) continue;
    var b2 = document.createElement('span');
    b2.className = 'tts-btn';
    b2.innerHTML = '&#128266;';
    b2.onclick = (function (nn, ltr) { return function () { ttsSayA(nn, ltr); }; })(n, letter);
    tvs[j].insertBefore(b2, tvs[j].firstChild);
  }
}


function whyTitle() {
  if (currentLang == 'en') return ui('whyTitle');
  if (currentLang == 'pa') return ui('whyTitle');
  return ui('whyTitle');
}
function pickWhy(r) {
  if (!r) return '';
  var t = r['explicacao_' + currentLang] || r.explicacao_pt || r.explicacao_en || '';
  if (t == 'ignorar' || t == 'null' || t == null || t == undefined) t = '';
  return t;
}
function whyBoxHTML(txt) {
  return '<div class="why-correct-box"><span class="why-correct-title">' + ui('whyTitle') + '</span>'
    + '<div class="why-correct-text">' + txt + '</div></div>';
}
function loadWhyCorrect(i) {
  var m = reviewMaster[i];
  var slide = reviewSlideEl(i);
  if (!m || !slide) return;
  var area = slide.querySelector('.why-correct-row');
  if (!area) return;
  if (!area.querySelector('.why-inline')) {
    var w = document.createElement('div');
    w.className = 'why-inline';
    w.style.display = 'none';
    area.appendChild(w);
  }
  var box = area.querySelector('.why-inline');
  area.style.display = 'block';
  var qid = m.q_id || m.id;
  var paint = function (r) {
    var t = pickWhy(r);
    if (t) {
      box.innerHTML = whyBoxHTML(t);
      box.style.display = 'block';
    } else {
      var waiting = (typeof aiExplFillRunning != 'undefined' && aiExplFillRunning);
      box.textContent = waiting ? ui('whyWaiting') : ui('whyEmpty');
      box.style.display = 'block';
      if (waiting) setTimeout(function () { delete whyStore[qid]; loadWhyCorrect(i); }, 750);
    }
  };
  if (whyStore[qid] !== undefined) { paint(whyStore[qid]); return; }
  if (!qid || typeof getAIState != 'function') return;
  getAIState(qid).then(function (res) {
    var r = (res && res.length) ? res[0] : null;
    if (r && r.explicacao_ok == 1) whyStore[qid] = r; else whyStore[qid] = null;
    paint(whyStore[qid]);
  }).catch(function () { whyStore[qid] = null; });
}
/* chips IA na revisão: mostram a explicação guardada na BD (inline) */
function showInlineAIExplanation(n) { loadWhyCorrect(n - 1); }

/* hooks do painel IA (js/ai.js) */
function getQuestionForAI(n) {
  var m = reviewMaster[n - 1];
  if (!m) return null;
  return { id: m.q_id, q_id: m.q_id, pergunta: m.pergunta, pergunta_en: m.pergunta_en,
    pergunta_pa: m.pergunta_pa, resposta_a: m.resposta_a, resposta_b: m.resposta_b,
    resposta_c: m.resposta_c, resposta_d: m.resposta_d,
    resposta_a_en: m.resposta_a_en, resposta_b_en: m.resposta_b_en,
    resposta_c_en: m.resposta_c_en, resposta_d_en: m.resposta_d_en,
    resposta_a_pa: m.resposta_a_pa, resposta_b_pa: m.resposta_b_pa,
    resposta_c_pa: m.resposta_c_pa, resposta_d_pa: m.resposta_d_pa,
    correcta: m.correcta, explicacao_ok: m.explicacao_ok,
    explicacao_pt: m.explicacao_pt, explicacao_en: m.explicacao_en, explicacao_pa: m.explicacao_pa,
    imagePath: m.imagePath || '', imagem: m.imagem || '' };
}
function onQuestionTranslated(n) {
  if (currentLang == 'en' || currentLang == 'pa') updateSlide(n - 1);
}


function switchLangReview() {
  currentLang = langCycleReview();
  persistLang();
  updateLangSwitchLabel();
  for (var i = 0; i < reviewMaster.length; i++) updateSlide(i);
  refreshUIStrings();
  if (currentLang == 'en' || currentLang == 'pa') startFillQueueReview();
}
function startFillQueueReview() {
  if (fillQueueRunningReview) return;
  fillQueueRunningReview = true;
  (async function () {
    for (var i = 0; i < reviewMaster.length; i++) {
      var m = reviewMaster[i];
      if (!m) continue;
      if (currentLang == 'en' ? validText(m.pergunta_en) : validText(m.pergunta_pa)) continue;
      try {
        var d = await getQuestionAI(m);
        applyAIToQuestion(m, d);
        if (currentLang != 'pt') updateSlide(i);
      } catch (e) { /* offline: mantém PT */ }
    }
    fillQueueRunningReview = false;
  })();
}
function refreshUIStrings() {
  $id('revTitle').textContent = ui('title');
  $id('closeBtn').textContent = ui('close');
  var filters = document.querySelectorAll('.rev-filter');
  var map = { all: ui('all'), bad: ui('bad'), ok: ui('ok') };
  for (var i = 0; i < filters.length; i++) {
    filters[i].textContent = map[filters[i].getAttribute('data-f')] || filters[i].textContent;
  }
}


var activeFilter = 'all';
function applyFilter(f) {
  activeFilter = f;
  var filters = document.querySelectorAll('.rev-filter');
  for (var i = 0; i < filters.length; i++) {
    filters[i].classList.toggle('active', filters[i].getAttribute('data-f') === f);
  }
  var slides = document.querySelectorAll('#showcase .ex-slide');
  var dots = document.querySelectorAll('#numStrip .ex-dot');
  var firstVisible = -1, visibleCount = 0;
  for (var s = 0; s < slides.length; s++) {
    var ok = slides[s].getAttribute('data-ok');
    var vis = (f === 'all') || (f === 'bad' && ok === 'bad') || (f === 'ok' && ok === 'ok');
    slides[s].classList.toggle('filtered-out', !vis);
    dots[s].classList.toggle('filtered-out', !vis);
    if (vis) { visibleCount++; if (firstVisible < 0) firstVisible = s + 1; }
  }
  var emptyNote = $id('filterEmpty');
  if (emptyNote) emptyNote.style.display = visibleCount ? 'none' : 'block';
  if (firstVisible > 0) showSlide(firstVisible);
  else showSlide(1);
}
function showSlide(n) {
  var slides = document.querySelectorAll('#showcase .ex-slide');
  if (n < 1 || n > slides.length) return;
  var target = slides[n - 1];
  if (target && target.classList.contains('filtered-out')) return;
  pergActual = n;
  for (var i = 0; i < slides.length; i++) {
    slides[i].style.display = (i === n - 1) ? 'block' : 'none';
  }
  var dots = document.querySelectorAll('#numStrip .ex-dot');
  for (var d = 0; d < dots.length; d++) {
    dots[d].classList.toggle('current', Number(dots[d].getAttribute('data-n')) === n);
  }
  $id('prevBtn').disabled = (n <= 1);
  $id('nextBtn').disabled = (n >= slides.length);
  $id('revProgress').textContent = n + ui('of') + slides.length;
  if (typeof ttsDecorateSlide == 'function') ttsDecorateSlide(n - 1);
}
function goPrev() { showSlide(pergActual - 1); }
function goNext() { showSlide(pergActual + 1); }
function renderStrip() {
  var html = '';
  for (var i = 1; i <= reviewMaster.length; i++) {
    html += '<button type="button" class="ex-dot" data-n="' + i + '">' + i + '</button>';
  }
  $id('numStrip').innerHTML = html;
}

document.addEventListener('click', function (e) {
  var dot = e.target.closest && e.target.closest('.ex-dot');
  if (dot && !dot.classList.contains('filtered-out')) showSlide(Number(dot.getAttribute('data-n')));
  var filt = e.target.closest && e.target.closest('.rev-filter');
  if (filt) applyFilter(filt.getAttribute('data-f'));
  var img = e.target.closest && e.target.closest('.ex-img');
  if (img && img.src) {
    var z = document.getElementById('imageZoomOverlay');
    if (!z) {
      z = document.createElement('div'); z.id = 'imageZoomOverlay'; z.className = 'image-zoom-overlay';
      z.innerHTML = '<button type="button" class="image-zoom-close" aria-label="Close">×</button><img alt="">';
      z.addEventListener('click', function (ev) { if (ev.target === z || ev.target.closest('.image-zoom-close')) z.classList.remove('open'); });
      document.body.appendChild(z);
    }
    z.querySelector('img').src = img.src; z.classList.add('open');
  }
});

$id('langSwitch').addEventListener('click', switchLangReview);
$id('prevBtn').addEventListener('click', goPrev);
$id('nextBtn').addEventListener('click', goNext);
$id('closeBtn').addEventListener('click', function () {
  window.location.href = 'result.html?' + vars.join(',');
});
$id('revBack').addEventListener('click', function () {
  window.location.href = 'result.html?' + vars.join(',');
});

setTimeout(function () {
  waitForDb(function () {
    UpdateRevisao();
  });
}, 500);
</script>
