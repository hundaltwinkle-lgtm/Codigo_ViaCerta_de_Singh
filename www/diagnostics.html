<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Diagnóstico</title><link rel="stylesheet" href="css/mobile-base.css"></head><body><header class="app-bar"><button class="lang-btn" onclick="history.back()">‹</button><div class="app-title">Diagnóstico</div></header><main class="page"><section class="card"><h2>Estado da aplicação</h2><p id="state">A preparar diagnóstico…</p><button id="copy" class="btn btn-primary">Copiar diagnóstico</button></section><section class="card"><h2>Atualizações</h2><p>Versão 2.0.0. As atualizações da app requerem um APK assinado com a mesma chave; atualizações de conteúdo mantêm o progresso local.</p></section></main><script src="js/mobile-db.js"></script><script src="js/mobile-learning.js"></script><script>(async function(){var x=await IMTLearning.diagnostics();state.textContent='Base de dados pronta. '+x.dashboard.total+' perguntas acompanhadas; '+x.logs.length+' eventos de diagnóstico guardados.';copy.onclick=async function(){var t=await IMTLearning.exportDiagnostics();try{await navigator.clipboard.writeText(t);copy.textContent='Copiado';}catch(e){prompt('Copie o diagnóstico:',t);}};})();</script></body></html>
