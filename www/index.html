<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b52f2a">
<meta name="mobile-web-app-capable" content="yes">
<title>IMT_27 Código</title>
<link rel="stylesheet" href="css/mobile-base.css">
<style>
  /* estilos exclusivos do ecrã de arranque (usa os tokens da base) */
  html, body { background: var(--grad-red); color: #fff; min-height: 100%; }
  .splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--safe-top) + 24px) 28px calc(var(--safe-bottom) + 24px);
    text-align: center;
  }
  .splash-logo {
    width: 96px; height: 96px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 800; letter-spacing: 1px;
    margin-bottom: 22px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.22);
  }
  .splash h1 {
    margin: 0 0 4px; font-size: 30px; font-weight: 800; letter-spacing: 0.4px;
  }
  .splash .owner {
    margin: 0 0 34px; font-size: 15px; opacity: 0.92; letter-spacing: 0.3px;
  }
  .splash progress {
    width: min(320px, 78vw); height: 8px; border: 0; border-radius: 999px;
    overflow: hidden; background: rgba(255,255,255,0.25); margin-bottom: 18px;
  }
  .splash progress::-webkit-progress-bar { background: rgba(255,255,255,0.25); border-radius: 999px; }
  .splash progress::-webkit-progress-value {
    background: #fff; border-radius: 999px; transition: width 0.45s ease;
  }
  .splash progress { transition: width .45s ease; }
  .splash-steps {
    list-style: none; margin: 0; padding: 0;
    font-size: 13px; opacity: 0.95; min-height: 64px;
  }
  .splash-steps li { margin: 3px 0; }
  .splash-steps li::before { content: "• "; }
  .splash-steps li.done::before { content: "✓ "; }
  .splash-steps li.done { opacity: 1; font-weight: 600; }
  .splash #retry { margin-top: 14px; }
  .splash .brand-note {
    position: absolute; bottom: calc(var(--safe-bottom) + 14px); left: 0; right: 0;
    font-size: 11px; opacity: 0.8; letter-spacing: 0.4px;
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="splash-logo">IMT</div>
    <h1>IMT_27 Código</h1>
    <p class="owner">Lakhwinder Singh</p>

    <progress id="progress" max="4" value="0"></progress>

    <ul class="splash-steps">
      <li id="startup-db">A abrir a base de dados…</li>
      <li id="startup-questions">A verificar as perguntas instaladas…</li>
      <li id="startup-access">A preparar o acesso local…</li>
      <li id="startup-ready">Verificações concluídas. A abrir a aplicação…</li>
    </ul>

    <button id="retry" class="btn btn-primary" hidden>Tentar novamente</button>

    <div class="brand-note">Copyright © 2026 Lakhwinder Singh</div>
  </div>

  <!-- Ordem de carregamento (bridge): jquery -> mobile-db (carrega
       lib/sql-wasm.js dinamicamente) -> mobile-ai -> mobile-tts ->
       mobile-apputil -> script da página -->
  <script src="lib/jquery.min.js"></script>
  <script src="js/mobile-db.js"></script>
  <script src="js/mobile-ai.js"></script>
  <script src="js/mobile-tts.js"></script>
  <script src="js/mobile-apputil.js"></script>
  <script src="js/mobile-main.js"></script>
</body>
</html>
