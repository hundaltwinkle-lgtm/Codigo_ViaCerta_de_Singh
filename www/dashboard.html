<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b4f8a"><title>IMT_27 · Hoje</title><link rel="stylesheet" href="css/mobile-base.css"><style>.hero{background:var(--grad-red);color:#fff;padding:28px 18px 24px}.hero h1{margin:0;font-size:28px}.hero p{opacity:.9}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px}.metric{padding:16px 8px;text-align:center}.metric b{font-size:27px;display:block;color:var(--sr-blue)}.actions{display:grid;gap:10px;margin:14px}.actions .btn{justify-content:flex-start;border-radius:var(--radius)}.topic{display:flex;justify-content:space-between;gap:8px}.progress{height:7px;background:#d9e6f1;border-radius:6px;overflow:hidden}.progress i{display:block;background:var(--sr-green);height:100%}</style></head><body><header class="app-bar"><div class="app-title">IMT_27 Código<small>Plano de estudo</small></div><span class="spacer"></span><button class="lang-btn" onclick="location='settings.html'" aria-label="Definições">⚙</button></header><main class="page"><section class="hero"><h1>Hoje</h1><p id="plan">A preparar o seu plano personalizado…</p><button class="btn" id="today" type="button">Começar revisão</button></section><section class="metrics"><div class="card metric"><b id="due">0</b><span>para rever</span></div><div class="card metric"><b id="mastered">0</b><span>dominadas</span></div><div class="card metric"><b id="accuracy">0%</b><span>precisão</span></div></section><section class="actions"><button class="btn btn-primary" onclick="location='menu.html'">🚗 Escolher categoria e exame</button><button class="btn" onclick="location='review-center.html'">↻ Centro de revisão e erros</button><button class="btn" onclick="location='content.html'">▧ Conteúdo offline</button><button class="btn" onclick="location='diagnostics.html'">⌁ Diagnóstico e atualização</button></section><section class="card"><strong>Domínio por tema</strong><div id="topics" class="muted" style="margin-top:12px">Ainda não existem respostas registadas.</div></section></main><script src="js/mobile-db.js"></script><script src="js/mobile-learning.js"></script><script>(async function(){try{var d=await IMTLearning.dashboard();due.textContent=d.due;mastered.textContent=d.mastered;accuracy.textContent=d.accuracy+'%';plan.textContent=d.due?'Tem '+d.due+' perguntas prontas para revisão.':'Faça um exame para criar o seu primeiro plano de revisão.';var ts=await IMTLearning.topics();topics.innerHTML=ts.slice(0,5).map(function(x){var a=Number(x.accuracy||0);return '<div class="topic"><span>'+String(x.name||'Tema')+'</span><b>'+a+'%</b></div><div class="progress"><i style="width:'+a+'%"></i></div>';}).join('')||topics.textContent;}catch(e){IMTLearning.log('error','dashboard',e.message,'');plan.textContent='Não foi possível preparar o plano.';}}());document.getElementById('today').onclick=function(){location='review-center.html';};</script></body></html>
